name: Native address selection
on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-core/src/addrinfo.rs'
      - '.github/workflows/addrinfo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  addrinfo:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4aa29d4d717a34e6acc7984e66bad94dd34717f6
      - name: Apply immutable public resolver integration candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resolver
          test "$(git hash-object .github/workflows/native-resolver.yml)" = 69338ec799e2b062fba1d25dc1d4afb01061261f
          test "$(git hash-object crates/frankenlibc-abi/src/resolv_abi.rs)" = a6e26a1c2b76b5bf459363540dbeaa8bcb17ae6e
          test "$(git hash-object crates/frankenlibc-core/src/dns_transport.rs)" = 5d6eb03caddf5d79a246bed69e4a2606a8605de4
          test "$(git hash-object tests/integration/fixture_native_dns_transport.c)" = 14354f8bb854e85dc6497a6a381fdb25c1091852
          test "$(git hash-object tests/integration/native_dns_fixture.py)" = 9b85e3668e5a309b051a27aae418e7fc58867c77
          test "$(git hash-object crates/frankenlibc-abi/tests/resolv_abi_test.rs)" = cab40c2c87385649a864b1a3e863a79671a106fb
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/19b4ba92051abc78dbbb558f0be05e8d6002c8df" --jq .content | base64 --decode > "$RUNNER_TEMP/addrinfo.patch.gz"
          test "$(git hash-object "$RUNNER_TEMP/addrinfo.patch.gz")" = 19b4ba92051abc78dbbb558f0be05e8d6002c8df
          gzip -dc "$RUNNER_TEMP/addrinfo.patch.gz" > "$RUNNER_TEMP/addrinfo.patch"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/88e18f920ba92865cf036b17465acbe7260c80a2" --jq .content | base64 --decode > "$RUNNER_TEMP/canonical-test.patch"
          test "$(git hash-object "$RUNNER_TEMP/canonical-test.patch")" = 88e18f920ba92865cf036b17465acbe7260c80a2
          git apply --check "$RUNNER_TEMP/addrinfo.patch" "$RUNNER_TEMP/canonical-test.patch"
          git apply "$RUNNER_TEMP/addrinfo.patch" "$RUNNER_TEMP/canonical-test.patch"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Format changed Rust modules and check fixture syntax
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/frankenlibc-core/src/addrinfo.rs crates/frankenlibc-core/src/dns_transport.rs crates/frankenlibc-abi/src/resolv_abi.rs
          python3 -m py_compile tests/integration/native_dns_fixture.py
          git diff --check
      - name: Execute address policy and resolver regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p frankenlibc-core --lib addrinfo:: -- --nocapture 2>&1 | tee artifacts/resolver/addrinfo.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/addrinfo.log
          cargo test -p frankenlibc-core --lib dns_transport:: -- --nocapture 2>&1 | tee artifacts/resolver/transport.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/transport.log
          FRANKENLIBC_PROPTEST_CASES=10000 cargo test -p frankenlibc-core --lib resolv::dns:: -- --nocapture 2>&1 | tee artifacts/resolver/decoder.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/decoder.log
          FRANKENLIBC_PROPTEST_CASES=10000 cargo test -p frankenlibc-core --lib resolv::config:: -- --nocapture 2>&1 | tee artifacts/resolver/config.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/config.log
          cargo test -p frankenlibc-core --lib resolv::tests::reverse_hosts_ -- --nocapture 2>&1 | tee artifacts/resolver/reverse-hosts.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/reverse-hosts.log
      - name: Build actual release ABI and C caller
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p frankenlibc-abi --lib --keep-going 2>&1 | tee artifacts/resolver/abi-check.log
          cargo test -p frankenlibc-abi --test resolv_abi_test getaddrinfo -- --nocapture --test-threads=1 2>&1 | tee artifacts/resolver/existing-addrinfo.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/existing-addrinfo.log
          cargo build --release -p frankenlibc-abi --lib 2>&1 | tee artifacts/resolver/abi-build.log
          cc -Wall -Wextra -Werror tests/integration/fixture_native_dns_transport.c -ldl -o target/native-dns-abi
          test -f target/release/libfrankenlibc_abi.so
          nm -D --defined-only target/release/libfrankenlibc_abi.so > artifacts/resolver/exports.txt
          for symbol in getaddrinfo freeaddrinfo getnameinfo; do
            grep -E "[[:space:]]${symbol}(@@[^[:space:]]+)?$" artifacts/resolver/exports.txt
          done
      - name: Exercise public resolver in all eight transport loading and mode combinations
        shell: bash
        run: |
          set -euo pipefail
          printf 'nameserver 127.0.0.1\nsearch first.test second.test\noptions timeout:1 attempts:1\n' > artifacts/resolver/resolv-udp.conf
          printf 'nameserver 127.0.0.1\nsearch first.test second.test\noptions timeout:1 attempts:1 use-vc\n' > artifacts/resolver/resolv-tcp.conf
          printf '127.0.0.1 fixture.local.test fixture localhost\n192.0.2.200 files-v4.local.test alias-files\n2001:0DB8:0000:0000:0000:0000:0000:0200 files-v6.local.test\n192.0.2.201 dual-v4.local.test dual-files\n2001:db8::201 dual-v6.local.test dual-files\n::1 loopback-v6.local.test loopback-files\n' > artifacts/resolver/hosts
          printf 'franken-stream 4443/tcp\nfranken-datagram 4443/udp\n' > artifacts/resolver/services
          status=0
          for transport in udp tcp; do
            for loading in dlopen preload; do
              extra=()
              if [[ "$transport" == tcp ]]; then extra+=(--tcp-only); fi
              if [[ "$loading" == preload ]]; then extra+=(--preload); fi
              for mode in strict hardened; do
                log="artifacts/resolver/abi-$transport-$loading-$mode.log"
                if ! sudo -n unshare --mount --net --uts -- bash -eu -c '
                  mount --make-rprivate /
                  ip link set lo up
                  hostname fixture.local.test
                  mount --bind "$1" /etc/resolv.conf
                  mount --bind "$6" /etc/hosts
                  mount --bind "$7" /etc/services
                  export FRANKENLIBC_MODE="$2"
                  exec python3 "$3" "$4" "$5" "${@:8}"
                ' bash \
                  "$PWD/artifacts/resolver/resolv-$transport.conf" "$mode" \
                  "$PWD/tests/integration/native_dns_fixture.py" \
                  "$PWD/target/native-dns-abi" \
                  "$PWD/target/release/libfrankenlibc_abi.so" \
                  "$PWD/artifacts/resolver/hosts" "$PWD/artifacts/resolver/services" "${extra[@]}" \
                  2>&1 | tee "$log"; then
                  status=1
                fi
                if ! grep -Eq 'native DNS ABI: [1-9][0-9]* passed' "$log"; then status=1; fi
              done
            done
          done
          exit "$status"
      - name: Preserve exact candidate source and hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resolver/source
          for path in crates/frankenlibc-core/src/addrinfo.rs crates/frankenlibc-core/src/dns_transport.rs crates/frankenlibc-abi/src/resolv_abi.rs crates/frankenlibc-abi/tests/resolv_abi_test.rs tests/integration/fixture_native_dns_transport.c tests/integration/native_dns_fixture.py .github/workflows/native-resolver.yml; do
            mkdir -p "artifacts/resolver/source/$(dirname "$path")"
            cp "$path" "artifacts/resolver/source/$path"
            printf '%s %s\n' "$(git hash-object "$path")" "$path" | tee -a artifacts/resolver/source-hashes.txt
          done
          git diff > artifacts/resolver/candidate.diff
      - name: Publish validated immutable blobs without advancing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for path in crates/frankenlibc-core/src/addrinfo.rs crates/frankenlibc-core/src/dns_transport.rs crates/frankenlibc-abi/src/resolv_abi.rs crates/frankenlibc-abi/tests/resolv_abi_test.rs tests/integration/fixture_native_dns_transport.c tests/integration/native_dns_fixture.py .github/workflows/native-resolver.yml; do
            blob=$(jq -Rs '{content: ., encoding:"utf-8"}' "$path" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            test "$blob" = "$(git hash-object "$path")"
            printf '%s %s\n' "$blob" "$path" | tee -a artifacts/resolver/published-blobs.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: addrinfo-integration-results
          path: artifacts/resolver/**
