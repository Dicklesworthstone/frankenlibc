name: Native address selection
on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-core/src/addrinfo.rs'
      - 'crates/frankenlibc-core/src/addrinfo/**'
      - 'crates/frankenlibc-core/src/dns_transport.rs'
      - 'crates/frankenlibc-core/src/resolv/**'
      - 'crates/frankenlibc-core/src/nss/**'
      - 'crates/frankenlibc-abi/src/nss_module.rs'
      - 'crates/frankenlibc-abi/src/glibc_internal_abi.rs'
      - 'crates/frankenlibc-abi/src/inet_abi.rs'
      - 'crates/frankenlibc-abi/src/grp_abi.rs'
      - 'crates/frankenlibc-abi/src/pwd_abi.rs'
      - 'crates/frankenlibc-abi/src/resolv_abi.rs'
      - 'crates/frankenlibc-abi/src/unistd_abi.rs'
      - 'crates/frankenlibc-abi/tests/nss_module_test.rs'
      - 'crates/frankenlibc-abi/tests/grp_abi_test.rs'
      - 'crates/frankenlibc-abi/tests/pwd_abi_test.rs'
      - 'crates/frankenlibc-abi/tests/unistd_abi_test.rs'
      - 'crates/frankenlibc-abi/tests/getnameinfo_differential_fuzz.rs'
      - 'crates/frankenlibc-abi/tests/resolv_abi_test.rs'
      - 'tests/integration/fixture_nss_module_lib.c'
      - 'tests/integration/fixture_nss_modules.c'
      - 'scripts/check_nss_services.py'
      - '.github/workflows/addrinfo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  addrinfo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Exercise the deployed address policy and existing ABI regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/addrinfo
          cargo test -p frankenlibc-core --lib addrinfo:: -- --nocapture 2>&1 | tee artifacts/addrinfo/core.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/addrinfo/core.log
          cargo test -p frankenlibc-core --lib resolv::tests::addrconfig_netlink -- --nocapture 2>&1 | tee artifacts/addrinfo/addrconfig.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/addrinfo/addrconfig.log
          for mode in strict hardened; do
            log="artifacts/addrinfo/abi-${mode}.log"
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi --test resolv_abi_test getaddrinfo -- --nocapture --test-threads=1 2>&1 | tee "$log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$log"
          done
      - name: Compare GNU default hints in a loopback-only network namespace
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p frankenlibc-abi --test resolv_abi_test --no-run --message-format=json > artifacts/addrinfo/test-build.json
          test_binary="$(python3 - <<'PY'
          import json
          from pathlib import Path
          candidates = set()
          for line in Path("artifacts/addrinfo/test-build.json").read_text().splitlines():
              entry = json.loads(line)
              if entry.get("reason") == "compiler-artifact" and entry.get("target", {}).get("name") == "resolv_abi_test" and entry.get("executable"):
                  candidates.add(entry["executable"])
          assert len(candidates) == 1, candidates
          print(candidates.pop())
          PY
          )"
          for mode in strict hardened; do
            log="artifacts/addrinfo/loopback-${mode}.log"
            sudo env FRANKENLIBC_MODE="$mode" unshare --net -- "$test_binary" \
              --exact getaddrinfo_default_hints_match_host_glibc --nocapture --test-threads=1 \
              2>&1 | tee "$log"
            grep -Eq '^test result: ok\. 1 passed; 0 failed;' "$log"
          done
      - name: Exercise installed NSS hosts modules in strict and hardened modes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/addrinfo
          status=0
          for mode in strict hardened; do
            log="artifacts/addrinfo/nss-modules-${mode}.log"
            if ! FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi \
              --test nss_module_test hosts_modules_ -- --nocapture --test-threads=1 \
              2>&1 | tee "$log"; then status=1; fi
            if ! grep -Eq '^test result: ok\. 4 passed; 0 failed;' "$log"; then status=1; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: addrinfo-results
          path: artifacts/addrinfo/**
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature: [default, owned-tls-cache]
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - name: Build the deployed services candidate and exercise NSS policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nss-services
          cargo test -p frankenlibc-core --lib nss:: -- --nocapture \
            2>&1 | tee artifacts/nss-services/core.log
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed;' artifacts/nss-services/core.log
          args=()
          if [[ '${{ matrix.feature }}' != default ]]; then
            args+=(--features '${{ matrix.feature }}')
          fi
          cargo build --release -p frankenlibc-abi --lib "${args[@]}" \
            2>&1 | tee artifacts/nss-services/build.log
          cp target/release/libfrankenlibc_abi.so artifacts/nss-services/libfrankenlibc_abi.so
      - name: Exercise runtime source replacement during concurrent lookup
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ '${{ matrix.feature }}' != default ]]; then
            args+=(--features '${{ matrix.feature }}')
          fi
          cargo test -p frankenlibc-abi --test nss_module_test "${args[@]}" \
            runtime_configure_lookup_replaces_concurrent_source_snapshots \
            -- --exact --nocapture --test-threads=1 \
            2>&1 | tee artifacts/nss-services/runtime-configure.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' artifacts/nss-services/runtime-configure.log
      - name: Compare installed services and runtime configuration through the deployed ABI
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 scripts/check_nss_services.py \
            --candidate "$PWD/artifacts/nss-services/libfrankenlibc_abi.so" \
            --output "$PWD/artifacts/nss-services/cases" \
            2>&1 | tee artifacts/nss-services/differential.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nss-services-${{ matrix.feature }}
          path: artifacts/nss-services/**
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        feature: [default, owned-tls-cache]
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: target/identity
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Check formatting of the touched identity and local socket surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/identity
          rustfmt --check --edition 2024 \
            crates/frankenlibc-abi/src/grp_abi.rs \
            crates/frankenlibc-abi/src/pwd_abi.rs \
            crates/frankenlibc-abi/src/unistd_abi.rs \
            crates/frankenlibc-abi/src/resolv_abi.rs \
            crates/frankenlibc-abi/tests/grp_abi_test.rs \
            crates/frankenlibc-abi/tests/pwd_abi_test.rs \
            crates/frankenlibc-abi/tests/unistd_abi_test.rs \
            crates/frankenlibc-abi/tests/getnameinfo_differential_fuzz.rs \
            2>&1 | tee artifacts/identity/format.log
      - name: Compile the identity and local socket targets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/identity
          args=()
          if [[ '${{ matrix.feature }}' != default ]]; then
            args+=(--features '${{ matrix.feature }}')
          fi
          cargo check -p frankenlibc-abi --lib --keep-going \
            --test grp_abi_test --test pwd_abi_test --test unistd_abi_test \
            --test getnameinfo_differential_fuzz "${args[@]}" \
            2>&1 | tee artifacts/identity/check.log
      - name: Lint the identity and local socket targets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/identity
          args=()
          if [[ '${{ matrix.feature }}' != default ]]; then
            args+=(--features '${{ matrix.feature }}')
          fi
          cargo clippy -p frankenlibc-abi --lib --keep-going \
            --test grp_abi_test --test pwd_abi_test --test unistd_abi_test \
            --test getnameinfo_differential_fuzz "${args[@]}" -- -D warnings \
            2>&1 | tee artifacts/identity/clippy.log
      - name: Exercise native NSS identity and getnameinfo in both runtime modes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/identity
          args=()
          if [[ '${{ matrix.feature }}' != default ]]; then
            args+=(--features '${{ matrix.feature }}')
          fi
          status=0
          for mode in strict hardened; do
            for spec in grp_abi_test:nss_files_ pwd_abi_test:nss_files_ pwd_abi_test:getsp unistd_abi_test:nss_files_ getnameinfo_differential_fuzz:getnameinfo_; do
              target="${spec%%:*}"
              filter="${spec#*:}"
              log="artifacts/identity/${target}-${filter}-${mode}.log"
              if ! FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi \
                --test "$target" "${args[@]}" "$filter" -- --nocapture --test-threads=1 \
                2>&1 | tee "$log"; then status=1; fi
              if ! grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed;' "$log"; then status=1; fi
            done
          done
          exit "$status"
      - name: Compare local socket names with a dotted hostname in an isolated UTS namespace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/identity
          args=()
          if [[ '${{ matrix.feature }}' != default ]]; then
            args+=(--features '${{ matrix.feature }}')
          fi
          cargo test -p frankenlibc-abi --test getnameinfo_differential_fuzz \
            "${args[@]}" --no-run --message-format=json > artifacts/identity/local-test-build.json
          test_binary="$(python3 - <<'PY'
          import json
          from pathlib import Path
          candidates = set()
          for line in Path("artifacts/identity/local-test-build.json").read_text().splitlines():
              entry = json.loads(line)
              if entry.get("reason") == "compiler-artifact" and entry.get("target", {}).get("name") == "getnameinfo_differential_fuzz" and entry.get("executable"):
                  candidates.add(entry["executable"])
          assert len(candidates) == 1, candidates
          print(candidates.pop())
          PY
          )"
          status=0
          for mode in strict hardened; do
            log="artifacts/identity/local-uts-${mode}.log"
            if ! timeout 60s sudo -n unshare --uts -- bash -euc \
              'hostname frankenlibc.example.test; exec env FRANKENLIBC_MODE="$1" "$2" getnameinfo_local_ --nocapture --test-threads=1' \
              bash "$mode" "$test_binary" 2>&1 | tee "$log"; then status=1; fi
            if ! grep -Eq '^test result: ok\. 3 passed; 0 failed;' "$log"; then status=1; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-${{ matrix.feature }}
          path: artifacts/identity/**
