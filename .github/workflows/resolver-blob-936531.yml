name: Assemble verified resolver source

on:
  push:
    branches: [main]
    paths: [.github/workflows/resolver-blob-936531.yml]

permissions:
  contents: write

jobs:
  assemble:
    if: github.repository == 'Dicklesworthstone/frankenlibc' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create verified source blob without changing any branch
        env:
          API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          import zlib

          repository = 'Dicklesworthstone/frankenlibc'
          original_sha = 'ae30387c026bf1a9597598ece07045865d8bb8d6'
          expected_sha = '936531897916ff2a75b7b632672e4ea4939ec543'
          path = 'crates/frankenlibc-abi/src/resolv_abi.rs'
          encoded = ''

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def blob_sha(content):
              return hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()

          def api(method, suffix, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repository + suffix,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['API_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)

          payload = zlib.decompress(base64.b64decode(encoded, validate=True))
          require(hashlib.sha256(payload).hexdigest() == '0bf7da801f94b4e6520865b185c1d2a7b0cb435b0303dd52ce77a433537bb44d', 'Patch payload checksum mismatch')
          edits = json.loads(payload)
          response = api('GET', '/git/blobs/' + original_sha)
          require(response['encoding'] == 'base64', 'Unexpected blob encoding')
          source = base64.b64decode(response['content'])
          require(blob_sha(source) == original_sha, 'Original source checksum mismatch')
          text = source.decode('utf-8')
          for edit in edits:
              require(edit['path'] == path, 'Unexpected patch path')
              before = edit['before']
              require(before and text.count(before) == 1, 'Patch anchor must be unique: ' + edit['name'])
              text = text.replace(before, edit['after'], 1)
          updated = text.encode('utf-8')
          require(blob_sha(updated) == expected_sha, 'Updated source checksum mismatch')
          result = api('POST', '/git/blobs', {'content': text, 'encoding': 'utf-8'})
          require(result['sha'] == expected_sha, 'GitHub blob checksum mismatch')
          print('VERIFIED_RESOLVER_BLOB=' + result['sha'])
          print('No commit or branch reference was created or changed by this job.')
          PY
