name: Native RPC client creation and one-shot calls
on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-abi/src/rpc*'
      - 'crates/frankenlibc-abi/src/resolv_abi.rs'
      - 'crates/frankenlibc-abi/src/nss_module.rs'
      - 'crates/frankenlibc-abi/tests/rpc*'
      - 'crates/frankenlibc-core/src/rpc/**'
      - 'crates/frankenlibc-core/src/crypt/des.rs'
      - 'crates/frankenlibc-core/src/nss/mod.rs'
      - 'tests/integration/fixture_rpc_client_create.c'
      - 'tests/integration/fixture_rpc_identity*.c'
      - 'tests/integration/fixture_rpc_secretkey_module.c'
      - 'scripts/check_rpc_client_create.py'
      - 'scripts/check_rpc_identity.py'
      - 'scripts/check_rpc_secretkey.py'
      - '.github/workflows/rpc-client-create.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        feature: [default, owned-tls-cache]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the independent Secure RPC files oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y libtirpc-dev
      - name: Record the committed client implementation
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/rpc-clients
          mkdir -p "$root/source"
          git rev-parse HEAD > "$root/revision.txt"
          rustc --version --verbose > "$root/rustc.txt"
          git diff --exit-code HEAD -- crates/frankenlibc-abi/src/rpc*.rs crates/frankenlibc-abi/tests/rpc_abi_test.rs crates/frankenlibc-core/src/rpc/mod.rs tests/integration/fixture_rpc_client_create.c scripts/check_rpc_client_create.py
          for file in crates/frankenlibc-abi/src/rpc_abi.rs crates/frankenlibc-abi/src/rpc_client_create.rs crates/frankenlibc-abi/src/rpc_udp.rs crates/frankenlibc-abi/src/rpc_call.rs crates/frankenlibc-abi/tests/rpc_abi_test.rs crates/frankenlibc-core/src/rpc/mod.rs tests/integration/fixture_rpc_client_create.c scripts/check_rpc_client_create.py; do
            cp "$file" "$root/source/"
            git hash-object "$file" >> "$root/source-blobs.txt"
          done
          mkdir -p "$root/identity-source"
          for file in crates/frankenlibc-abi/src/nss_module.rs crates/frankenlibc-core/src/nss/mod.rs crates/frankenlibc-core/src/rpc/secret.rs crates/frankenlibc-core/src/crypt/des.rs tests/integration/fixture_rpc_identity.c tests/integration/fixture_rpc_identity_module.c tests/integration/fixture_rpc_secretkey_module.c scripts/check_rpc_identity.py scripts/check_rpc_secretkey.py; do
            cp --parents "$file" "$root/identity-source/"
            git hash-object "$file" >> "$root/identity-source-blobs.txt"
          done
      - name: Compile release ABI and execute existing RPC contracts
        env:
          FEATURE: ${{ matrix.feature }}
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/rpc-clients
          args=()
          if [[ "$FEATURE" != default ]]; then args=(--features "$FEATURE"); fi
          cargo generate-lockfile
          cargo build --locked --release -p frankenlibc-abi --lib "${args[@]}" 2>&1 | tee "$root/build.log"
          cp target/release/libfrankenlibc_abi.so "$root/"
          cp Cargo.lock "$root/Cargo.lock"
          sha256sum "$root/libfrankenlibc_abi.so" > "$root/library.sha256"
          sudo python3 "$PWD/scripts/check_rpc_identity.py" "$PWD/$root/libfrankenlibc_abi.so" --output "$PWD/$root/identity"
          sudo python3 "$PWD/scripts/check_rpc_secretkey.py" "$PWD/$root/libfrankenlibc_abi.so" --output "$PWD/$root/secretkey"
          # Exclusive loopback port 111; never stop or reconfigure rpcbind.
          sudo python3 "$PWD/scripts/check_rpc_client_create.py" "$PWD/$root/libfrankenlibc_abi.so" --output "$PWD/$root/clients"
          cargo test --locked -p frankenlibc-core --lib rpc:: -- --test-threads=1 2>&1 | tee "$root/rpc-core.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$root/rpc-core.log"
          cargo test --locked -p frankenlibc-core --lib nss::tests -- --test-threads=1 2>&1 | tee "$root/nss-core.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$root/nss-core.log"
          for target in rpc_abi_test rpc_udp_transport_test rpc_tcp_frontend_test rpc_auth_recovery_test rpc_svc_cache_test; do
            cargo test --locked -p frankenlibc-abi --test "$target" "${args[@]}" -- --test-threads=1 2>&1 | tee "$root/$target.log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$root/$target.log"
          done
          sudo python3 "$PWD/scripts/check_gai_async.py" "$PWD/$root/libfrankenlibc_abi.so" --output "$PWD/$root/dns"
          python3 scripts/check_aio_completion.py "$PWD/$root/libfrankenlibc_abi.so" --output "$root/aio"
      - name: Verify tested inputs still match the checkout
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--',
              'crates/frankenlibc-abi/src/rpc*.rs', 'crates/frankenlibc-abi/tests/rpc_abi_test.rs',
              'crates/frankenlibc-core/src/rpc/mod.rs',
              'tests/integration/fixture_rpc_client_create.c', 'scripts/check_rpc_client_create.py'], check=True)
          root = pathlib.Path('artifacts/rpc-clients')
          assert pathlib.Path('Cargo.lock').read_bytes() == (root / 'Cargo.lock').read_bytes()
          paths = ['crates/frankenlibc-abi/src/rpc_abi.rs',
              'crates/frankenlibc-abi/src/rpc_client_create.rs',
              'crates/frankenlibc-abi/src/rpc_udp.rs', 'crates/frankenlibc-abi/src/rpc_call.rs',
              'crates/frankenlibc-abi/tests/rpc_abi_test.rs',
              'crates/frankenlibc-core/src/rpc/mod.rs',
              'tests/integration/fixture_rpc_client_create.c', 'scripts/check_rpc_client_create.py']
          for name in paths:
              source = pathlib.Path(name)
              assert source.read_bytes() == (root / 'source' / source.name).read_bytes()
          for source in (root / 'identity-source').rglob('*'):
              if source.is_file():
                  assert source.read_bytes() == source.relative_to(root / 'identity-source').read_bytes()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpc-clients-${{ matrix.feature }}
          path: artifacts/rpc-clients/
          if-no-files-found: error
          retention-days: 7
