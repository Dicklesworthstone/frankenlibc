name: Owned and host exit lifecycle
on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-abi/src/exit_handlers.rs'
      - 'crates/frankenlibc-abi/src/stdlib_abi.rs'
      - 'crates/frankenlibc-abi/src/unistd_abi.rs'
      - 'tests/integration/fixture_exit_tickets*'
      - 'scripts/check_exit_tickets.py'
      - '.github/workflows/exit-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        feature: [default, owned-tls-cache]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Qualify the reviewed exit registry integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/exit
          git rev-parse HEAD > artifacts/exit/revision.txt
          rustc --version --verbose > artifacts/exit/rustc.txt
          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('crates/frankenlibc-abi/src/stdlib_abi.rs')
          data = p.read_bytes()
          def blob(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          assert blob(data) == '16e67ad6ca59ff7e586ccfdce2e7831af9f83da4'
          text = data.decode()
          start = text.index('static EXIT_HANDLERS:')
          end = text.index("/// The executable's `fini`", start)
          text = text[:start] + '#[path = "exit_handlers.rs"]\nmod exit_handlers;\nuse exit_handlers::{register_exit_handler, run_exit_handlers};\npub(crate) use exit_handlers::{finalize_cxa_handlers, register_cxa_exit_handler};\n\n' + text[end:]
          start = text.index('fn run_exit_handlers(status: c_int) {')
          end = text.index('/// `on_exit`', start)
          text = text[:start] + text[end:]
          old = '    register_exit_handler(ExitHandler::OnExit(OnExitEntry { func: f, arg }));\n    runtime_policy::observe(ApiFamily::Stdlib, decision.profile, 4, false);\n    0'
          new = '    let result = register_exit_handler(ExitHandler::OnExit(OnExitEntry { func: f, arg }));\n    runtime_policy::observe(ApiFamily::Stdlib, decision.profile, 4, result != 0);\n    result'
          assert text.count(old) == 1
          text = text.replace(old, new)
          text = text.replace('    //    Swap-extract under the lock, release, then iterate: invoking user\n    //    callbacks while holding the mutex would self-deadlock on re-entrant\n    //    registrations (bd-3jpoz).', '    //    Claim one entry under the lock, then invoke it without the lock.\n    //    Reentrant registrations take precedence over older entries.')
          assert blob(text.encode()) == '8a81e5787a1a131d77904123a29f977bb4e8518f'
          p.write_text(text)
          PY
          rustfmt --edition 2024 crates/frankenlibc-abi/src/exit_handlers.rs
          for file in stdlib_abi.rs exit_handlers.rs; do
            cp "crates/frankenlibc-abi/src/$file" artifacts/exit/
            git hash-object "crates/frankenlibc-abi/src/$file" >> artifacts/exit/source-blobs.txt
          done
      - name: Execute actual release exits and destructor regressions
        env:
          FEATURE: ${{ matrix.feature }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$FEATURE" != default ]]; then args=(--features "$FEATURE"); fi
          cargo build --release -p frankenlibc-abi --lib "${args[@]}" 2>&1 | tee artifacts/exit/build.log
          cp target/release/libfrankenlibc_abi.so artifacts/exit/
          python3 scripts/check_exit_tickets.py "$PWD/target/release/libfrankenlibc_abi.so" --output artifacts/exit/cases
          cargo test -p frankenlibc-abi --test dlfcn_native_cxa_test "${args[@]}" -- --test-threads=1 2>&1 | tee artifacts/exit/cxa.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' artifacts/exit/cxa.log
          cargo test -p frankenlibc-abi --test stdlib_abi_test on_exit_ "${args[@]}" -- --test-threads=1 2>&1 | tee artifacts/exit/on-exit.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' artifacts/exit/on-exit.log
      - name: Publish only tested immutable source objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          blobs = {}
          for name in ['stdlib_abi.rs', 'exit_handlers.rs']:
              path = pathlib.Path('crates/frankenlibc-abi/src')/name
              data = path.read_bytes()
              assert data == (pathlib.Path('artifacts/exit')/name).read_bytes()
              expected = hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              req = urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs', data=json.dumps({'content': data.decode(), 'encoding': 'utf-8'}).encode(), headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(req) as response: result = json.load(response)
              assert result['sha'] == expected
              blobs[str(path)] = expected
          pathlib.Path('artifacts/exit/published-blobs.json').write_text(json.dumps(blobs, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-lifecycle-${{ matrix.feature }}
          path: artifacts/exit/
          if-no-files-found: error
          retention-days: 7
