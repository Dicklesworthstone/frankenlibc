          cargo check -p frankenlibc-abi --lib --keep-going 2>&1 | tee artifacts/resolver/abi-check.log
          git diff --check
      - name: Publish validated candidate objects without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          parent=$(git rev-parse HEAD)
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$parent" --jq .tree.sha)
          entries='[]'
          for path in crates/frankenlibc-abi/src/resolv_abi.rs crates/frankenlibc-core/src/dns_transport.rs .github/workflows/native-resolver.yml; do
