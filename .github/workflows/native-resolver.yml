name: Native resolver

on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-core/src/addrinfo.rs'
      - 'crates/frankenlibc-core/src/dns_transport.rs'
      - 'crates/frankenlibc-core/src/dns_transport/**'
      - 'crates/frankenlibc-core/tests/raw_dns_transport.rs'
      - 'crates/frankenlibc-core/src/resolv/**'
      - 'crates/frankenlibc-core/src/socket/**'
      - 'crates/frankenlibc-core/src/nss/**'
      - 'crates/frankenlibc-core/src/netgroup/**'
      - 'crates/frankenlibc-core/src/rpc/**'
      - 'crates/frankenlibc-abi/src/resolv_abi.rs'
      - 'crates/frankenlibc-abi/src/resolv_state.rs'
      - 'crates/frankenlibc-abi/src/unistd_abi.rs'
      - 'crates/frankenlibc-abi/src/glibc_internal_abi.rs'
      - 'crates/frankenlibc-abi/src/nss_module.rs'
      - 'crates/frankenlibc-abi/src/pwd_abi.rs'
      - 'crates/frankenlibc-abi/src/stdio_abi.rs'
      - 'crates/frankenlibc-abi/tests/unistd_abi_test.rs'
      - 'crates/frankenlibc-abi/tests/resolv_abi_test.rs'
      - 'crates/frankenlibc-abi/tests/resolver_no_aaaa_test.rs'
      - 'crates/frankenlibc-abi/tests/pwd_abi_test.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_getrpcent.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_innetgr.rs'
      - 'crates/frankenlibc-abi/tests/fixtures/innetgr_synthetic.netgroup'
      - 'tests/integration/fixture_nss.c'
      - 'tests/integration/fixture_addrconfig.c'
      - 'tests/integration/fixture_native_dns_transport.c'
      - 'tests/integration/native_dns_fixture.py'
      - '.github/workflows/native-resolver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Compile and execute native DNS transport and policy tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resolver
          cargo test -p frankenlibc-core --lib addrinfo:: -- --nocapture 2>&1 | tee artifacts/resolver/addrinfo.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/addrinfo.log
          cargo test -p frankenlibc-core --lib dns_transport:: -- --nocapture 2>&1 | tee artifacts/resolver/transport.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/transport.log
          cargo test -p frankenlibc-core --test raw_dns_transport -- --nocapture 2>&1 | tee artifacts/resolver/raw-transport.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/raw-transport.log
          FRANKENLIBC_PROPTEST_CASES=10000 cargo test -p frankenlibc-core --lib resolv::dns:: -- --nocapture 2>&1 | tee artifacts/resolver/decoder.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/decoder.log
          FRANKENLIBC_PROPTEST_CASES=10000 cargo test -p frankenlibc-core --lib resolv::config:: -- --nocapture 2>&1 | tee artifacts/resolver/config.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/config.log
          cargo test -p frankenlibc-core --lib resolv::tests::reverse_hosts_ -- --nocapture 2>&1 | tee artifacts/resolver/reverse-hosts.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/reverse-hosts.log
      - name: Check ABI integration
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p frankenlibc-abi --lib --keep-going 2>&1 | tee artifacts/resolver/abi-check.log
      - name: Verify GNU default hints, address families and AAAA suppression
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for mode in strict hardened; do
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi --test resolv_abi_test getaddrinfo_default_hints -- --test-threads=1 --nocapture 2>&1 | tee "artifacts/resolver/default-hints-$mode.log"
            grep -Eq '^test result: ok\. 4 passed; 0 failed; 0 ignored;' "artifacts/resolver/default-hints-$mode.log"
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi --test resolver_no_aaaa_test -- --test-threads=1 --nocapture 2>&1 | tee "artifacts/resolver/no-aaaa-$mode.log"
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "artifacts/resolver/no-aaaa-$mode.log"
          done
      - name: Verify native files providers, RPC, gshadow and password locks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resolver
          status=0
          for mode in strict hardened; do
            for filter in nss_files_ hosts_enumeration_; do
              log="artifacts/resolver/files-$filter-$mode.log"
              if ! FRANKENLIBC_MODE="$mode" cargo test --locked --no-fail-fast -p frankenlibc-abi \
                --test resolv_abi_test "$filter" -- --test-threads=1 --nocapture \
                2>&1 | tee "$log"; then status=1; fi
              if ! grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then status=1; fi
            done
            log="artifacts/resolver/password-lock-unit-$mode.log"
            if ! FRANKENLIBC_MODE="$mode" cargo test --locked --no-fail-fast -p frankenlibc-abi \
              --test pwd_abi_test lckpwdf -- --test-threads=1 --nocapture \
              2>&1 | tee "$log"; then status=1; fi
            if ! grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then status=1; fi
            if ! grep -Fxq 'test lckpwdf_creates_private_cloexec_lock_and_excludes_other_processes ... ok' "$log"; then status=1; fi
            if ! grep -Fxq 'test lckpwdf_open_failure_preserves_error_and_allows_retry ... ok' "$log"; then status=1; fi
            log="artifacts/resolver/gshadow-unit-$mode.log"
            if ! FRANKENLIBC_MODE="$mode" cargo test --locked --no-fail-fast -p frankenlibc-abi \
              --test pwd_abi_test gshadow -- --test-threads=1 --nocapture \
              2>&1 | tee "$log"; then status=1; fi
            if ! grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then status=1; fi
            log="artifacts/resolver/rpc-unit-$mode.log"
            if ! FRANKENLIBC_MODE="$mode" cargo test --locked --no-fail-fast -p frankenlibc-abi \
              --test conformance_diff_getrpcent -- --test-threads=1 --nocapture \
              2>&1 | tee "$log"; then status=1; fi
            if ! grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then status=1; fi
          done
          exit "$status"
      - name: Verify netgroup NSS policy and iterator recovery against GNU
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resolver
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          for module in nss netgroup; do
            cargo test -p frankenlibc-core --lib "$module::tests::" -- --test-threads=1 --nocapture \
              2>&1 | tee "artifacts/resolver/netgroup-$module.log"
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "artifacts/resolver/netgroup-$module.log"
          done
          # Compile as the runner user; only the finished test process needs
          # permission to mount private /etc fixtures. System NSS is untouched.
          cargo test -p frankenlibc-abi --test conformance_diff_innetgr --no-run --message-format=json \
            | tee artifacts/resolver/netgroup-build.jsonl
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('artifacts/resolver')
          executables = []
          for line in (root / 'netgroup-build.jsonl').read_text().splitlines():
              item = json.loads(line)
              if (item.get('reason') == 'compiler-artifact'
                      and item.get('target', {}).get('name') == 'conformance_diff_innetgr'
                      and item.get('executable')):
                  executables.append(item['executable'])
          assert len(executables) == 1, executables
          (root / 'netgroup-executable.txt').write_text(executables[0] + '\n')
          PY
          executable=$(cat artifacts/resolver/netgroup-executable.txt)
          test -x "$executable"
          for mode in strict hardened; do
            sudo -n env FRANKENLIBC_MODE="$mode" "$executable" --test-threads=1 --nocapture \
              2>&1 | tee "artifacts/resolver/netgroup-abi-$mode.log"
            grep -Eq '^test result: ok\. 3 passed; 0 failed; 0 ignored;' "artifacts/resolver/netgroup-abi-$mode.log"
          done
      - name: Reject failed interface discovery without publishing partial snapshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resolver
          for mode in strict hardened; do
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi --test unistd_abi_test \
              getifaddrs_syscall_errors_are_not_successful_snapshots -- --test-threads=1 --nocapture \
              2>&1 | tee "artifacts/resolver/interface-errors-$mode.log"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "artifacts/resolver/interface-errors-$mode.log"
          done
      - name: Verify complete interface records against GNU libc
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resolver
          cargo test -p frankenlibc-core --lib socket::tests::netlink_ -- --nocapture \
            2>&1 | tee artifacts/resolver/interface-parser.log
          grep -Eq '^test result: ok\. 10 passed; 0 failed; 0 ignored;' artifacts/resolver/interface-parser.log
          for mode in strict hardened; do
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi --test unistd_abi_test \
              getifaddrs_materialization_tests:: -- --test-threads=1 --nocapture \
              2>&1 | tee "artifacts/resolver/interface-materialization-$mode.log"
            grep -Eq '^test result: ok\. 6 passed; 0 failed; 0 ignored;' "artifacts/resolver/interface-materialization-$mode.log"
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi --test unistd_abi_test \
              getifaddrs_snapshot:: -- --test-threads=1 --nocapture \
              2>&1 | tee "artifacts/resolver/interface-snapshot-$mode.log"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "artifacts/resolver/interface-snapshot-$mode.log"
          done
      - name: Verify address-family selection before numeric and DNS lookup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resolver
          for mode in strict hardened; do
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi --test resolv_abi_test \
              getaddrinfo_ai_addrconfig -- --test-threads=1 --nocapture \
              2>&1 | tee "artifacts/resolver/addrconfig-$mode.log"
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "artifacts/resolver/addrconfig-$mode.log"
          done
      - name: Build release C exports and public caller
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Debug builds intentionally omit no_mangle on getaddrinfo. Test
          # the deployed export profile, not dependency-provided host symbols.
          cargo build --release -p frankenlibc-abi --lib 2>&1 | tee artifacts/resolver/abi-build.log
          cc -Wall -Wextra -Werror tests/integration/fixture_native_dns_transport.c -ldl -o target/native-dns-abi
          test -f target/release/libfrankenlibc_abi.so
          nm -D --defined-only target/release/libfrankenlibc_abi.so > artifacts/resolver/exports.txt
          grep -E '[[:space:]]getaddrinfo(@@[^[:space:]]+)?$' artifacts/resolver/exports.txt
          grep -E '[[:space:]]freeaddrinfo(@@[^[:space:]]+)?$' artifacts/resolver/exports.txt
          grep -E '[[:space:]]getnameinfo(@@[^[:space:]]+)?$' artifacts/resolver/exports.txt
      - name: Verify IDN canonical and reverse output against GNU
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resolver/idn
          for mode in strict hardened; do
            FRANKENLIBC_MODE="$mode" cargo test --locked -p frankenlibc-abi \
              --test resolv_abi_test resolver_idn_ -- --test-threads=1 --nocapture \
              2>&1 | tee "artifacts/resolver/idn/unit-$mode.log"
            grep -Eq '^test result: ok\. 3 passed; 0 failed; 0 ignored;' \
              "artifacts/resolver/idn/unit-$mode.log"
            FRANKENLIBC_MODE="$mode" cargo test --locked -p frankenlibc-abi \
              --test resolv_abi_test getnameinfo_ -- --test-threads=1 --nocapture \
              2>&1 | tee "artifacts/resolver/idn/getnameinfo-$mode.log"
            grep -Eq '^test result: ok\. 7 passed; 0 failed; 0 ignored;' \
              "artifacts/resolver/idn/getnameinfo-$mode.log"
          done
          cc -std=c11 -O2 -fno-builtin -Wall -Wextra -Werror \
            tests/integration/fixture_native_dns_transport.c -ldl -o target/idn-abi
          candidate="$PWD/target/release/libfrankenlibc_abi.so"
          test -f "$candidate"
          private_etc=$(mktemp -d "$RUNNER_TEMP/frankenlibc-idn.XXXXXX")
          printf 'hosts: files\n' > "$private_etc/nsswitch.conf"
          cat > "$private_etc/hosts" <<'HOSTS'
          192.0.2.241 xn--bcher-kva.test idn-latin
          192.0.2.242 xn--r8jz45g.xn--zckzah idn-japanese
          192.0.2.243 XN--bcher-kva.CaSe idn-case
          192.0.2.244 xn--bad_.test idn-malformed
          192.0.2.245 xn--bcher-kva.xn--bad_ idn-partial
          192.0.2.246 ordinary.CaSe idn-ascii
          192.0.2.247 xn--0.test idn-incomplete
          192.0.2.248 xn-- idn-empty
          192.0.2.249 xn--bcher-kva.xn--0 idn-partial-incomplete
          192.0.2.250 xn--hello-.test idn-basic
          192.0.2.251 xn--bad_-a.test idn-literal-underscore
          HOSTS
          for mode in strict hardened; do
            sudo -n timeout 45s bwrap --die-with-parent --unshare-net --unshare-pid \
              --ro-bind / / --bind "$private_etc" /etc --proc /proc -- \
              env -u LD_PRELOAD -u FRANKENLIBC_HOSTS_PATH -u FRANKENLIBC_NSSWITCH_PATH \
                FRANKENLIBC_MODE="$mode" "$PWD/target/idn-abi" "$candidate" --idn-only \
              2>&1 | tee "artifacts/resolver/idn/abi-$mode.log"
            grep -Fxq 'native IDN ABI: 204 passed' "artifacts/resolver/idn/abi-$mode.log"
          done
      - name: Preserve complete passwd and group records and buffer retries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resolver/account-files
          cc -D_GNU_SOURCE -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/integration/fixture_nss.c -ldl -o target/nss-account-files
          caller="$PWD/target/nss-account-files"
          candidate="$PWD/target/release/libfrankenlibc_abi.so"
          test -f "$candidate"
          host_libc="$(env -u LD_PRELOAD ldd "$caller" | awk '/libc.so.6/ {print $3; exit}')"
          test -f "$host_libc"
          prefix=artifacts/resolver/account-files
          if ! timeout 45s env -u LD_PRELOAD -u FRANKENLIBC_MODE \
            "$caller" --account-file-provider "$host_libc" \
            > "$prefix/host.log" 2> "$prefix/host.err"; then
            cat "$prefix/host.log" "$prefix/host.err"
            exit 1
          fi
          cat "$prefix/host.log"
          grep -Fxq 'fixture_nss: account-file provider PASS (96 contract observations)' "$prefix/host.log"
          for mode in strict hardened; do
            if ! timeout 45s env -u LD_PRELOAD FRANKENLIBC_MODE="$mode" \
              "$caller" --account-file-provider "$candidate" \
              > "$prefix/$mode.log" 2> "$prefix/$mode.err"; then
              cat "$prefix/$mode.log" "$prefix/$mode.err"
              exit 1
            fi
            cat "$prefix/$mode.log"
            cmp "$prefix/host.log" "$prefix/$mode.log"
          done
          set +e
          timeout 45s env -u LD_PRELOAD \
            "$caller" --account-file-provider "$RUNNER_TEMP/nss-no-such-provider-$GITHUB_RUN_ID.so" \
            > "$prefix/provider-negative.log" 2> "$prefix/provider-negative.err"
          rejected=$?
          set -e
          test "$rejected" -eq 42
      - name: Compare deployed hosts, gshadow, RPC and password locking with GNU
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resolver
          cc -D_GNU_SOURCE -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/integration/fixture_nss.c -ldl -o target/nss-files-abi
          caller="$PWD/target/nss-files-abi"
          candidate="$PWD/target/release/libfrankenlibc_abi.so"
          test -f "$candidate"
          host_libc="$(ldd "$caller" | awk '/libc.so.6/ {print $3; exit}')"
          test -n "$host_libc"
          command -v bwrap
          command -v setpriv
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          scratch_root=$(mktemp -d "$RUNNER_TEMP/frankenlibc-files-provider.XXXXXX")
          hosts_etc="$scratch_root/hosts-etc"
          mkdir -p "$hosts_etc" "$scratch_root/password-host" \
            "$scratch_root/password-strict" "$scratch_root/password-hardened"
          printf 'hosts: files\n' > "$hosts_etc/nsswitch.conf"
          printf 'multi on\n' > "$hosts_etc/host.conf"
          printf '2001:db8::7 ipv6-only.example ipv6-only\n192.0.2.10 dual-v4.example dual-alias\n2001:db8::10 dual-v6.example dual-alias\n' > "$hosts_etc/hosts"
          for row in $(seq 1 80); do
            printf '192.0.2.%s many.example many-alias\n' "$row" >> "$hosts_etc/hosts"
          done
          # A complete final row must survive the nonreentrant buffer's growth
          # and retain every alias when a reentrant caller retries it.
          printf '198.51.100.42 ' >> "$hosts_etc/hosts"
          printf 'n%.0s' {1..4096} >> "$hosts_etc/hosts"
          for alias in $(seq 1 80); do
            printf ' alias-%s-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' "$alias" >> "$hosts_etc/hosts"
          done
          printf '\n' >> "$hosts_etc/hosts"
          python3 - "$scratch_root" <<'PY'
          import pathlib, sys

          root = pathlib.Path(sys.argv[1])
          gshadow = root / "gshadow-etc"
          gshadow.mkdir()
          (gshadow / "nsswitch.conf").write_text("gshadow: files\n", encoding="ascii")
          admins = ",".join(f"administrator-{i:03d}-abcdefghijklmnopqrstuvwxyz" for i in range(80))
          members = ",".join(f"member-{i:03d}-abcdefghijklmnopqrstuvwxyz" for i in range(80))
          (gshadow / "gshadow").write_text(
              "frankenlibc-gshadow-first:!:alice,bob:carol,dave\n"
              f"frankenlibc-gshadow-long:!:{admins}:{members}\n"
              "frankenlibc-gshadow-last:!::last-member\n",
              encoding="ascii",
          )

          for kind in ("records", "missing", "directory"):
              private = root / f"rpc-{kind}"
              private.mkdir()
              (private / "nsswitch.conf").write_text("rpc: files\n", encoding="ascii")
          prefix = "frankenlibc-rpc-long-"
          canonical = prefix + "q" * (4096 - len(prefix))
          aliases = " ".join(f"Alias{i:03d}-" + "x" * 32 for i in range(96))
          (root / "rpc-records" / "rpc").write_text(
              "# Complete RPC records with malformed rows between them.\n"
              "\n"
              "invalid-rpc-row\n"
              "frankenlibc-rpc-first 700001 FirstAlias first-alt\n"
              "invalid-rpc-number not-a-number discarded\n"
              f"{canonical} 700002 {aliases}\n"
              "invalid-rpc-number-after not-a-number discarded\n"
              "frankenlibc-rpc-last 700003 LastAlias\n",
              encoding="ascii",
          )
          (root / "rpc-directory" / "rpc").mkdir()
          PY
          # Mount as root, then run the caller as the runner user. The private
          # /etc contains only fixtures, and dropping privileges keeps EACCES
          # observable when the password test makes its scratch lock read-only.
          run_private() {
            local private_etc=$1 log=$2
            shift 2
            sudo -n timeout 30s bwrap --die-with-parent --unshare-pid --ro-bind / / \
              --bind "$private_etc" /etc --proc /proc -- \
              setpriv --reuid="$runner_uid" --regid="$runner_gid" --clear-groups \
              env -u LD_PRELOAD -u FRANKENLIBC_MODE -u FRANKENLIBC_HOSTS_PATH \
                -u FRANKENLIBC_GSHADOW_PATH \
                -u FRANKENLIBC_NSSWITCH_PATH -u RESOLV_HOST_CONF -u RESOLV_MULTI \
                "$@" 2>&1 | tee "$log"
          }
          # Each hosts invocation resolves and verifies two distinct ELF
          # providers, then compares addresses, linked tuples, caller storage,
          # ERANGE retry, errno, h_errno and TTL against GNU in the same process.
          status=0
          for mode in strict hardened; do
            for query_rows in ipv6-only:1 dual-alias:2 many-alias:80; do
              query=${query_rows%:*}
              rows=${query_rows##*:}
              log="artifacts/resolver/files-hosts-$query-$mode.log"
              if ! run_private "$hosts_etc" "$log" FRANKENLIBC_MODE="$mode" \
                "$caller" --hosts-provider "$candidate" "$query" "$rows"; then status=1; fi
              if ! grep -Fxq "fixture_nss: hosts provider PASS (12 differential observations, $rows rows)" "$log"; then status=1; fi
            done
            log="artifacts/resolver/files-hosts-multi-off-$mode.log"
            if ! run_private "$hosts_etc" "$log" FRANKENLIBC_MODE="$mode" RESOLV_MULTI=off \
              "$caller" --hosts-provider "$candidate" many-alias 1; then status=1; fi
            if ! grep -Fxq 'fixture_nss: hosts provider PASS (12 differential observations, 1 rows)' "$log"; then status=1; fi
            log="artifacts/resolver/files-hosts-enumeration-$mode.log"
            if ! run_private "$hosts_etc" "$log" FRANKENLIBC_MODE="$mode" \
              "$caller" --hosts-enumeration-provider "$candidate" 82; then status=1; fi
            if ! grep -Eq '^fixture_nss: hosts enumeration provider PASS \([1-9][0-9]* differential observations, 82 records, 80 aliases, 4096-byte name\)$' "$log"; then status=1; fi
          done
          log=artifacts/resolver/gshadow-contract-host.log
          if ! run_private "$scratch_root/gshadow-etc" "$log" timeout 20s \
            "$caller" --gshadow-contract-provider "$host_libc"; then status=1; fi
          if ! grep -Fxq 'fixture_nss: gshadow contract PASS (13 independent observations)' "$log"; then status=1; fi
          for mode in strict hardened; do
            log="artifacts/resolver/gshadow-contract-$mode.log"
            if ! run_private "$scratch_root/gshadow-etc" "$log" FRANKENLIBC_MODE="$mode" \
              timeout 20s "$caller" --gshadow-contract-provider "$candidate"; then status=1; fi
            if ! grep -Fxq 'fixture_nss: gshadow contract PASS (13 independent observations)' "$log"; then status=1; fi
            log="artifacts/resolver/gshadow-differential-$mode.log"
            if ! run_private "$scratch_root/gshadow-etc" "$log" FRANKENLIBC_MODE="$mode" \
              timeout 20s "$caller" --gshadow-provider "$candidate" 3; then status=1; fi
            if ! grep -Fxq 'fixture_nss: gshadow provider PASS (221 differential observations, 3 database rows)' "$log"; then status=1; fi
          done
          for source_kind in records missing directory; do
            if [[ "$source_kind" == records ]]; then expected=34; else expected=6; fi
            private_etc="$scratch_root/rpc-$source_kind"
            log="artifacts/resolver/rpc-$source_kind-host.log"
            if ! run_private "$private_etc" "$log" timeout 20s \
              "$caller" --rpc-provider "$host_libc" "$source_kind"; then status=1; fi
            if ! grep -Fxq "fixture_nss: RPC provider PASS ($expected contract observations, $source_kind)" "$log"; then status=1; fi
            for mode in strict hardened; do
              log="artifacts/resolver/rpc-$source_kind-$mode.log"
              if ! run_private "$private_etc" "$log" FRANKENLIBC_MODE="$mode" \
                timeout 20s "$caller" --rpc-provider "$candidate" "$source_kind"; then status=1; fi
              if ! grep -Fxq "fixture_nss: RPC provider PASS ($expected contract observations, $source_kind)" "$log"; then status=1; fi
            done
          done
          log=artifacts/resolver/password-lock-host.log
          if ! run_private "$scratch_root/password-host" "$log" \
            "$caller" --password-lock-provider "$host_libc" "$scratch_root/password-host"; then status=1; fi
          if ! grep -Eq '^fixture_nss: password lock provider PASS \(timeout [0-9]+\.[0-9]+s\)$' "$log"; then status=1; fi
          for mode in strict hardened; do
            private_etc="$scratch_root/password-$mode"
            log="artifacts/resolver/password-lock-$mode.log"
            if ! run_private "$private_etc" "$log" FRANKENLIBC_MODE="$mode" \
              "$caller" --password-lock-fork-provider "$candidate" "$private_etc"; then status=1; fi
            if ! grep -Eq '^fixture_nss: password lock provider PASS \(timeout [0-9]+\.[0-9]+s\)$' "$log"; then status=1; fi
          done
          exit "$status"
      - name: Compare deployed address configuration with GNU in isolated namespaces
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -fno-builtin -Wall -Wextra -Werror tests/integration/fixture_addrconfig.c -ldl -o target/addrconfig-abi
          host_libc="$(ldd target/addrconfig-abi | awk '/libc.so.6/ {print $3; exit}')"
          test -n "$host_libc"
          for state in none ipv4 ipv6 dual; do
            sudo -n unshare --net -- bash -eu -c '
              ip link set lo up
              case "$1" in ipv4|dual) ip address add 192.0.2.1/32 dev lo ;; esac
              case "$1" in ipv6|dual) ip -6 address add 2001:db8::1/128 dev lo nodad ;; esac
              unset FRANKENLIBC_PROC_NET_ROUTE_PATH FRANKENLIBC_PROC_NET_IF_INET6_PATH
              env -u LD_PRELOAD -u FRANKENLIBC_MODE timeout 30 "$2" "$3" > "$5/addrconfig-$1-host.log"
              for mode in strict hardened; do
                timeout 30 env FRANKENLIBC_MODE="$mode" LD_PRELOAD="$4" "$2" "$4" > "$5/addrconfig-$1-$mode.log"
              done
            ' bash "$state" "$PWD/target/addrconfig-abi" "$host_libc" \
              "$PWD/target/release/libfrankenlibc_abi.so" "$PWD/artifacts/resolver"
            for mode in host strict hardened; do
              grep -qx 'addrconfig: 91 cases' "artifacts/resolver/addrconfig-$state-$mode.log"
              LC_ALL=C sort "artifacts/resolver/addrconfig-$state-$mode.log" > "artifacts/resolver/addrconfig-$state-$mode.sorted"
            done
            for mode in strict hardened; do
              diff -u "artifacts/resolver/addrconfig-$state-host.sorted" "artifacts/resolver/addrconfig-$state-$mode.sorted"
            done
          done
      - name: Exercise default hints through the deployed C ABI
        shell: bash
        run: |
          set -euo pipefail
          cc -D_GNU_SOURCE -std=c11 -O2 -Wall -Wextra -Werror -pthread tests/integration/fixture_nss.c -ldl -o target/nss-default-hints
          target/nss-default-hints | tee artifacts/resolver/default-hints-host.log
          for mode in strict hardened; do
            FRANKENLIBC_MODE="$mode" LD_PRELOAD="$PWD/target/release/libfrankenlibc_abi.so" target/nss-default-hints > "artifacts/resolver/default-hints-preload-$mode.log"
            diff -u artifacts/resolver/default-hints-host.log "artifacts/resolver/default-hints-preload-$mode.log"
          done
      - name: Exercise release resolver through dlopen and preload
        shell: bash
        run: |
          set -euo pipefail
          printf 'nameserver 127.0.0.1\nsearch first.test second.test\noptions timeout:1 attempts:1\n' > artifacts/resolver/resolv-udp.conf
          printf 'nameserver 127.0.0.1\nsearch first.test second.test\noptions timeout:1 attempts:1 use-vc\n' > artifacts/resolver/resolv-tcp.conf
          printf '127.0.0.1 fixture.local.test fixture localhost\n192.0.2.200 files-v4.local.test alias-files\n2001:0DB8:0000:0000:0000:0000:0000:0200 files-v6.local.test\n' > artifacts/resolver/hosts
          printf '192.0.2.220 dual-v4.local.test dual-files\n2001:db8::220 dual-v6.local.test dual-files\n::1 loopback-v6.local.test loopback-files\n' >> artifacts/resolver/hosts
          printf 'franken-stream 4443/tcp\nfranken-datagram 4443/udp\n' > artifacts/resolver/services
          status=0
          for transport in udp tcp; do
            for loading in dlopen preload; do
              extra=()
              if [[ "$transport" == tcp ]]; then extra+=(--tcp-only); fi
              if [[ "$loading" == preload ]]; then extra+=(--preload); fi
              for mode in strict hardened; do
                log="artifacts/resolver/abi-$transport-$loading-$mode.log"
                # Private mount and network namespaces: no runner/system DNS
                # mutation, privileged-port conflict, or external DNS traffic.
                # Run every combination even after failure, but fail the job
                # if any check fails. Never turn missing execution into green.
                if ! sudo -n unshare --mount --net --uts -- bash -eu -c '
                  mount --make-rprivate /
                  ip link set lo up
                  hostname fixture.local.test
                  mount --bind "$1" /etc/resolv.conf
                  mount --bind "$6" /etc/hosts
                  mount --bind "$7" /etc/services
                  export FRANKENLIBC_MODE="$2"
                  exec python3 "$3" "$4" "$5" "${@:8}"
                ' bash \
                  "$PWD/artifacts/resolver/resolv-$transport.conf" "$mode" \
                  "$PWD/tests/integration/native_dns_fixture.py" \
                  "$PWD/target/native-dns-abi" \
                  "$PWD/target/release/libfrankenlibc_abi.so" \
                  "$PWD/artifacts/resolver/hosts" "$PWD/artifacts/resolver/services" "${extra[@]}" \
                  2>&1 | tee "$log"; then
                  status=1
                fi
                if ! grep -Eq 'native DNS ABI: [1-9][0-9]* passed' "$log"; then status=1; fi
              done
            done
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-resolver-results
          path: artifacts/resolver/**
