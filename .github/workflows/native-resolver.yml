          candidate=$(jq -n --arg parent "$parent" --arg tree "$tree" --arg message "$message" '{message:$message, tree:$tree, parents:[$parent]}' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq .sha)
