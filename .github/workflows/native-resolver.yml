    # Temporary integration build: publishes only an unreferenced candidate
    # commit. It NEVER updates a branch. The candidate restores read-only CI.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
