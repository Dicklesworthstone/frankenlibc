name: Native raw resolver

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-raw-resolver.yml'
      - 'crates/frankenlibc-core/src/dns_transport.rs'
      - 'crates/frankenlibc-core/src/dns_transport/**'
      - 'crates/frankenlibc-core/src/resolv/config.rs'
      - 'crates/frankenlibc-core/src/resolv/dns.rs'
      - 'crates/frankenlibc-core/src/resolv/dns_name.rs'
      - 'crates/frankenlibc-core/tests/raw_dns_transport.rs'
      - 'crates/frankenlibc-core/tests/dns_nameserver_failover.rs'
      - 'tests/conformance/raw_res_send_host.c'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare a diagnostic harness pointing to the committed DNS sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/raw-resolver
          git rev-parse HEAD > artifacts/raw-resolver/source-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          root = Path.cwd()
          paths = [
              'crates/frankenlibc-core/src/dns_transport.rs',
              'crates/frankenlibc-core/src/dns_transport/raw.rs',
              'crates/frankenlibc-core/src/resolv/config.rs',
              'crates/frankenlibc-core/src/resolv/dns.rs',
              'crates/frankenlibc-core/src/resolv/dns_name.rs',
              'crates/frankenlibc-core/tests/raw_dns_transport.rs',
              'crates/frankenlibc-core/tests/dns_nameserver_failover.rs',
          ]
          hashes = {path: subprocess.check_output(['git', 'hash-object', path], text=True).strip() for path in paths}
          Path('artifacts/raw-resolver/source-blobs.json').write_text(json.dumps(hashes, indent=2) + '\n')
          # Direct path attributes compile the committed implementation and its
          # original tests. No source overlays or substitutes are applied.
          # This diagnostic is not full-workspace or release-ABI validation.
          harness = Path(os.environ['RUNNER_TEMP']) / 'raw-resolver-source'
          harness.mkdir()
          modules = 'pub mod resolv {\n'
          for module in ('config', 'dns_name', 'dns'):
              path = root / ('crates/frankenlibc-core/src/resolv/' + module + '.rs')
              modules += '#[path = ' + json.dumps(str(path)) + '] pub mod ' + module + ';\n'
          modules += 'pub use config::ResolverConfig;\n}\n'
          modules += '#[path = ' + json.dumps(str(root / 'crates/frankenlibc-core/src/dns_transport.rs')) + '] pub mod dns_transport;\n'
          (harness / 'src.rs').write_text(modules)
          manifest = '[package]\nname = "frankenlibc-core"\nversion = "0.0.0"\nedition = "2024"\n[workspace]\n[lib]\npath = "src.rs"\n'
          for name in ('raw_dns_transport', 'dns_nameserver_failover'):
              path = root / ('crates/frankenlibc-core/tests/' + name + '.rs')
              manifest += '\n[[test]]\nname = ' + json.dumps(name) + '\npath = ' + json.dumps(str(path)) + '\n'
          (harness / 'Cargo.toml').write_text(manifest)
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - name: Compile and execute actual DNS source and socket tests
        shell: bash
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/artifacts/raw-resolver/source-tests.log"
          cd "$RUNNER_TEMP/raw-resolver-source"
          cargo +nightly-2026-08-31 test --offline -- --nocapture 2>&1 | tee "$log"
          test "$(grep -Ec 'test result: ok\. [1-9][0-9]* passed;' "$log")" -eq 3
      - name: Check the independent host wire-length oracle
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/conformance/raw_res_send_host.c -pthread -lresolv -ldl -o "$RUNNER_TEMP/raw-res-send-host"
          timeout 30 "$RUNNER_TEMP/raw-res-send-host" | tee artifacts/raw-resolver/host.log
          grep -Fq '18 host-glibc raw-send cases passed' artifacts/raw-resolver/host.log
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/conformance/raw_res_send_host.c -pthread -lresolv -ldl -o "$RUNNER_TEMP/raw-res-send-ubsan"
          timeout 30 "$RUNNER_TEMP/raw-res-send-ubsan" | tee artifacts/raw-resolver/host-ubsan.log
          grep -Fq '18 host-glibc raw-send cases passed' artifacts/raw-resolver/host-ubsan.log
      - name: Verify validation did not alter tracked source
        shell: bash
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-raw-resolver-source-${{ matrix.runner }}
          path: artifacts/raw-resolver/**
