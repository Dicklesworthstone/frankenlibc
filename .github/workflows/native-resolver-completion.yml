name: Native resolver completion

on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-abi/src/resolv_abi.rs'
      - 'crates/frankenlibc-abi/src/resolv_abi/**'
      - 'crates/frankenlibc-abi/src/unistd_abi.rs'
      - 'crates/frankenlibc-abi/src/glibc_internal_abi.rs'
      - 'crates/frankenlibc-abi/tests/native_resolver_completion_test.rs'
      - 'crates/frankenlibc-abi/tests/raw_resolver_send_test.rs'
      - 'crates/frankenlibc-core/src/dns_transport.rs'
      - 'crates/frankenlibc-core/src/dns_transport/**'
      - 'crates/frankenlibc-core/src/resolv/**'
      - 'crates/frankenlibc-core/tests/dns_nameserver_failover.rs'
      - 'crates/frankenlibc-core/tests/raw_dns_transport.rs'
      - 'tests/conformance/native_reverse_ipv6.c'
      - 'tests/conformance/native_dns_cursor.c'
      - 'tests/conformance/raw_res_send_abi.c'
      - 'scripts/test_native_resolver.sh'
      - '.github/workflows/native-resolver-completion.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 2
  RUST_BACKTRACE: 1

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - name: Retain a single dependency snapshot for both validation jobs
        run: |
          set -euo pipefail
          if [[ ! -f Cargo.lock ]]; then cargo generate-lockfile; fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-resolver-dependency-lock
          path: Cargo.lock
          if-no-files-found: error

  core:
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-resolver-dependency-lock
          path: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
      - name: Execute native DNS transport and failover regressions
        run: |
          mkdir -p artifacts/resolver
          cargo test --locked -p frankenlibc-core --lib dns_transport:: -- --nocapture 2>&1 | tee artifacts/resolver/transport.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/transport.log
          cargo test --locked -p frankenlibc-core --test dns_nameserver_failover -- --nocapture 2>&1 | tee artifacts/resolver/failover.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/failover.log
          cargo test --locked -p frankenlibc-core --test raw_dns_transport -- --nocapture 2>&1 | tee artifacts/resolver/raw-sockets.log
          grep -Eq 'test result: ok\. 8 passed;' artifacts/resolver/raw-sockets.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-resolver-core-results
          path: artifacts/resolver/**

  abi:
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-resolver-dependency-lock
          path: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
      - name: Execute the actual Rust ABI parser
        run: |
          mkdir -p artifacts/resolver
          cargo test --locked -p frankenlibc-abi --test native_resolver_completion_test -- --nocapture 2>&1 | tee artifacts/resolver/parser.log
          grep -Eq 'test result: ok\. 8 passed;' artifacts/resolver/parser.log
      - name: Execute direct raw-send ABI guards
        run: |
          cargo test --locked -p frankenlibc-abi --test raw_resolver_send_test -- --nocapture 2>&1 | tee artifacts/resolver/raw-abi-guards.log
          grep -Eq 'test result: ok\. 3 passed;' artifacts/resolver/raw-abi-guards.log
      - name: Execute existing resolver ABI regressions
        run: |
          cargo test --locked -p frankenlibc-abi --test resolv_abi_test -- --nocapture 2>&1 | tee artifacts/resolver/existing-abi.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/existing-abi.log
      - name: Build the release candidate with its real exports
        run: |
          cargo build --locked --release -p frankenlibc-abi --lib 2>&1 | tee artifacts/resolver/release-build.log
      - name: Run C probes against host oracle and owner-pinned candidate
        run: |
          timeout 120 bash scripts/test_native_resolver.sh --host 2>&1 | tee artifacts/resolver/host.log
          for mode in strict hardened; do
            FRANKENLIBC_MODE="$mode" timeout 120 bash scripts/test_native_resolver.sh "$PWD/target/release/libfrankenlibc_abi.so" 2>&1 | tee "artifacts/resolver/candidate-$mode.log"
            grep -Eq 'PASS: [1-9][0-9]* .*\(candidate\)' "artifacts/resolver/candidate-$mode.log"
          done
      - name: Exercise exported raw-send network behavior in both modes
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/conformance/raw_res_send_abi.c -pthread -ldl -o "$RUNNER_TEMP/raw-res-send-abi"
          sudo timeout 30 unshare -n sh -c 'ip link set lo up; exec "$@"' sh "$RUNNER_TEMP/raw-res-send-abi" --host | tee artifacts/resolver/raw-exported-host.log
          grep -Fq '13 exported raw-send cases passed (host)' artifacts/resolver/raw-exported-host.log
          for mode in strict hardened; do
            sudo env FRANKENLIBC_MODE="$mode" timeout 30 unshare -n sh -c 'ip link set lo up; exec "$@"' sh "$RUNNER_TEMP/raw-res-send-abi" "$PWD/target/release/libfrankenlibc_abi.so" | tee "artifacts/resolver/raw-exported-$mode.log"
            grep -Fq '13 exported raw-send cases passed (candidate)' "artifacts/resolver/raw-exported-$mode.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-resolver-abi-results
          path: artifacts/resolver/**
