name: Validate native getnameinfo integration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/resolver-ptr-candidate.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Apply immutable reviewed patch and C fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resolver
          test "$(git hash-object crates/frankenlibc-abi/src/resolv_abi.rs)" = 62ef83936ff46643adbcffb9f191c5d8545f3b49
          test "$(git hash-object crates/frankenlibc-core/src/resolv/mod.rs)" = 12587186d5b13f31a19b1d6920e3ffc04fe13652
          test "$(git hash-object crates/frankenlibc-core/src/dns_transport.rs)" = acc3367101c58e2c6e49122af22f14ebb41d3caf
          test "$(git hash-object tests/integration/fixture_native_dns_transport.c)" = 0145d29aa4fafe30c4285fcdc89163b51380d763
          test "$(git hash-object tests/integration/native_dns_fixture.py)" = 1c7a4fbfe7cc31d7088b91edbe7b27cf4f1271e4
          test "$(git hash-object .github/workflows/native-resolver.yml)" = 35e3d79942bc07a809d68fbf955226d008cdc645
          fetch_blob() {
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$1" --jq .content | base64 --decode > "$2"
            test "$(git hash-object "$2")" = "$1"
          }
          fetch_blob ea310fd5c0c4d185097e235c83906ddcc81a201e "$RUNNER_TEMP/nameinfo.patch"
          git apply --recount --check "$RUNNER_TEMP/nameinfo.patch"
          git apply --recount "$RUNNER_TEMP/nameinfo.patch"
          fetch_blob 5931e054daaa7b7aa406bbdd8a002fd5bc890db2 tests/integration/fixture_native_dns_transport.c
          fetch_blob 5407576cf8690df4203abcf34ddce5e8f5d192c4 tests/integration/native_dns_fixture.py
          fetch_blob 69338ec799e2b062fba1d25dc1d4afb01061261f .github/workflows/native-resolver.yml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Format reviewed sources only
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true crates/frankenlibc-core/src/dns_transport.rs crates/frankenlibc-core/src/resolv/mod.rs crates/frankenlibc-abi/src/resolv_abi.rs
          git diff --check
          python3 -m py_compile tests/integration/native_dns_fixture.py
      - name: Execute transport, PTR, decoder, configuration and files tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p frankenlibc-core --lib dns_transport:: -- --nocapture 2>&1 | tee artifacts/resolver/transport.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/transport.log
          FRANKENLIBC_PROPTEST_CASES=10000 cargo test -p frankenlibc-core --lib resolv::dns:: -- --nocapture 2>&1 | tee artifacts/resolver/decoder.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/decoder.log
          FRANKENLIBC_PROPTEST_CASES=10000 cargo test -p frankenlibc-core --lib resolv::config:: -- --nocapture 2>&1 | tee artifacts/resolver/config.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/config.log
          cargo test -p frankenlibc-core --lib resolv::tests::reverse_hosts_ -- --nocapture 2>&1 | tee artifacts/resolver/reverse-hosts.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/resolver/reverse-hosts.log
      - name: Check ABI integration and build real release exports
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p frankenlibc-abi --lib --keep-going 2>&1 | tee artifacts/resolver/abi-check.log
          cargo build --release -p frankenlibc-abi --lib 2>&1 | tee artifacts/resolver/abi-build.log
          cc -Wall -Wextra -Werror tests/integration/fixture_native_dns_transport.c -ldl -o target/native-dns-abi
          test -f target/release/libfrankenlibc_abi.so
          nm -D --defined-only target/release/libfrankenlibc_abi.so > artifacts/resolver/exports.txt
          for symbol in getaddrinfo freeaddrinfo getnameinfo; do
            grep -E "[[:space:]]$symbol(@@[^[:space:]]+)?$" artifacts/resolver/exports.txt
          done
      - name: Exercise all eight release ABI combinations
        shell: bash
        run: |
          set -euo pipefail
          printf 'nameserver 127.0.0.1\noptions timeout:1 attempts:1\n' > artifacts/resolver/resolv-udp.conf
          printf 'nameserver 127.0.0.1\noptions timeout:1 attempts:1 use-vc\n' > artifacts/resolver/resolv-tcp.conf
          printf '127.0.0.1 fixture.local.test fixture localhost\n192.0.2.200 files-v4.local.test alias-files\n2001:0DB8:0000:0000:0000:0000:0000:0200 files-v6.local.test\n' > artifacts/resolver/hosts
          printf 'franken-stream 4443/tcp\nfranken-datagram 4443/udp\n' > artifacts/resolver/services
          status=0
          for transport in udp tcp; do
            for loading in dlopen preload; do
              extra=()
              if [[ "$transport" == tcp ]]; then extra+=(--tcp-only); fi
              if [[ "$loading" == preload ]]; then extra+=(--preload); fi
              for mode in strict hardened; do
                log="artifacts/resolver/abi-$transport-$loading-$mode.log"
                if ! sudo -n unshare --mount --net --uts -- bash -eu -c '
                  mount --make-rprivate /
                  ip link set lo up
                  hostname fixture.local.test
                  mount --bind "$1" /etc/resolv.conf
                  mount --bind "$6" /etc/hosts
                  mount --bind "$7" /etc/services
                  export FRANKENLIBC_MODE="$2"
                  exec python3 "$3" "$4" "$5" "${@:8}"
                ' bash \
                  "$PWD/artifacts/resolver/resolv-$transport.conf" "$mode" \
                  "$PWD/tests/integration/native_dns_fixture.py" \
                  "$PWD/target/native-dns-abi" \
                  "$PWD/target/release/libfrankenlibc_abi.so" \
                  "$PWD/artifacts/resolver/hosts" "$PWD/artifacts/resolver/services" "${extra[@]}" \
                  2>&1 | tee "$log"; then status=1; fi
                if ! grep -Eq 'native DNS ABI: [1-9][0-9]* passed' "$log"; then status=1; fi
              done
            done
          done
          exit "$status"
      - name: Preserve reviewed source and evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in crates/frankenlibc-core/src/dns_transport.rs crates/frankenlibc-core/src/resolv/mod.rs crates/frankenlibc-abi/src/resolv_abi.rs tests/integration/fixture_native_dns_transport.c tests/integration/native_dns_fixture.py .github/workflows/native-resolver.yml; do
            mkdir -p "artifacts/resolver/source/$(dirname "$path")"
            cp "$path" "artifacts/resolver/source/$path"
          done
          git diff > artifacts/resolver/reviewed.diff
      - name: Publish validated source blobs without advancing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for path in crates/frankenlibc-core/src/dns_transport.rs crates/frankenlibc-core/src/resolv/mod.rs crates/frankenlibc-abi/src/resolv_abi.rs; do
            blob=$(jq -Rs '{content: ., encoding:"utf-8"}' "$path" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            test "$blob" = "$(git hash-object "$path")"
            printf '%s %s\n' "$blob" "$path" | tee -a artifacts/resolver/published-blobs.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: getnameinfo-integration-results
          path: artifacts/resolver/**
