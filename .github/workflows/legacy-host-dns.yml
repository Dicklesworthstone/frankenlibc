name: Legacy host DNS source preparation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/legacy-host-dns.yml']
  workflow_dispatch:

# Temporary source preparation, NOT a Linux build or a runtime validation.
# It writes content-addressed objects only; all main commits are explicit.
# Replaced by the read-only Linux regression workflow with the source commit.
permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'Dicklesworthstone/frankenlibc' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read immutable reviewed source edits
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 360e969015c28b73a22547cd6f03086dfd084e76
          git show 360e969015c28b73a22547cd6f03086dfd084e76:.github/workflows/legacy-host-dns.yml > "$RUNNER_TEMP/legacy-reviewed.yml"
          test "$(git hash-object "$RUNNER_TEMP/legacy-reviewed.yml")" = 5f817c35a49fa5597aef79d6af87678205428414
          test "$(git hash-object crates/frankenlibc-abi/src/resolv_abi.rs)" = 17295cedac5adce51b5c1fe872b1257f66732e90
          python3 -m venv "$RUNNER_TEMP/legacy-venv"
          "$RUNNER_TEMP/legacy-venv/bin/pip" install PyYAML==6.0.2
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
      - name: Apply, format and store prepared source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/legacy-venv/bin/python" - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, urllib.request
          import yaml
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          reviewed = yaml.safe_load((temp / 'legacy-reviewed.yml').read_text())
          fixture = pathlib.Path('tests/conformance/legacy_dns_fixture.c')
          contents = fixture.read_text()
          old = 'check(rc == EAGAIN && result == NULL && herr == TRY_AGAIN, "reentrant temporary reverse failure");'
          new = 'check(rc == 0 && result == NULL && herr == TRY_AGAIN, "reentrant temporary reverse failure");'
          assert contents.count(old) == 1
          fixture.write_text(contents.replace(old, new, 1))
          sources = {'fixture': fixture}
          for step in reviewed['jobs']['validate']['steps']:
              if step.get('name') not in ('Apply reviewed forward implementation', 'Apply reviewed reverse implementation'):
                  continue
              code = step['run']
              stage = 'reverse' if 'reverse' in step['name'] else 'forward'
              if stage == 'reverse':
                  assert code.count('return code;') == 1
                  code = code.replace('return code;', 'return 0;', 1)
                  # Both reverse entry points report DNS failures via h_errno.
                  # Do not manufacture the forward API's EAGAIN errno write.
                  assert code.count('let (code, host_error) = legacy_host_lookup_error(error);') == 2
                  code = code.replace('let (code, host_error) = legacy_host_lookup_error(error);',
                                      'let (_, host_error) = legacy_host_lookup_error(error);')
                  code = code.replace('if code != 0 { unsafe { set_abi_errno(code) }; }', '')
              subprocess.run([sys.executable, '-c', code], check=True)
              path = pathlib.Path('crates/frankenlibc-abi/src/resolv_abi.rs')
              subprocess.run(['rustfmt', '--edition', '2024', str(path)], check=True)
              snapshot = temp / ('legacy-' + stage + '.rs')
              snapshot.write_bytes(path.read_bytes())
              sources[stage] = snapshot
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'diff', '--stat'], check=True)
          assert set(sources) == {'forward', 'reverse', 'fixture'}
          assert os.environ['GITHUB_REPOSITORY'] == 'Dicklesworthstone/frankenlibc'
          for stage, path in sources.items():
              content = path.read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              request = urllib.request.Request(
                  'https://api.github.com/repos/Dicklesworthstone/frankenlibc/git/blobs',
                  data=json.dumps({'content': content.decode(), 'encoding': 'utf-8'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == expected
              print('PREPARED_' + stage.upper() + '_BLOB=' + expected, flush=True)
          print('Formatting and source preparation passed; Linux compilation and runtime tests are separate.')
          PY
