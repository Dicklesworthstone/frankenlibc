name: Native hostent

on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-core/src/dns_transport.rs'
      - 'crates/frankenlibc-core/src/dns_transport/**'
      - 'crates/frankenlibc-abi/src/resolv_abi.rs'
      - 'crates/frankenlibc-abi/src/resolv_abi/**'
      - 'crates/frankenlibc-abi/src/unistd_abi.rs'
      - 'tests/integration/fixture_native_hostent.c'
      - 'tests/integration/native_hostent_fixture.py'
      - '.github/workflows/native-hostent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostent:
    if: github.ref == 'refs/heads/main'
    # BEGIN HOSTENT CANDIDATE
    permissions:
      contents: write
    # END HOSTENT CANDIDATE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      # BEGIN HOSTENT CANDIDATE
      - name: Apply immutable reviewed legacy resolver candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/hostent
          test "$(git hash-object crates/frankenlibc-core/src/dns_transport.rs)" = ccf19e60c6d62866fae266898e470246f518d262
          test "$(git hash-object crates/frankenlibc-abi/src/resolv_abi.rs)" = 3324239cd1e6e5698e6587b047fce913343fdd6c
          test "$(git hash-object crates/frankenlibc-abi/src/unistd_abi.rs)" = 8353b6e8043ec0ada26b9cf2f29f121a10611346
          for sha in 1aef9c444a8125272da573d0e2736ae777668bd8 6c672fb3abd2b6b266e8f02d65d85a2941630c5f; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode > "$RUNNER_TEMP/$sha"
            test "$(git hash-object "$RUNNER_TEMP/$sha")" = "$sha"
          done
          cat "$RUNNER_TEMP/1aef9c444a8125272da573d0e2736ae777668bd8" "$RUNNER_TEMP/6c672fb3abd2b6b266e8f02d65d85a2941630c5f" > "$RUNNER_TEMP/hostent.tar.gz"
          test "$(git hash-object "$RUNNER_TEMP/hostent.tar.gz")" = 075b757eddbb2c2b824de6941136bd488a56be7e
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, tarfile
          expected = {
              'core.patch': 'd1d04f7a46ae7ed04f52400e86b9727f87a3dae9',
              'abi.patch': '293dae741fb99f27781209da283001c733f4672c',
              'wire_name2.py': '056a5ef7643c8b52e6a2879994d6e6edf59e8f7b',
              'crates/frankenlibc-core/src/dns_transport/host.rs': 'e20d953eda2a4e0fdd849b018c65c1ad1ff99f62',
              'crates/frankenlibc-abi/src/resolv_abi/legacy_hostent.rs': '2e2b7fefeac6e84343f65d17a205bc6fa53d1112',
              'tests/integration/fixture_native_hostent.c': 'aa3b9c5056c5503dd7592bd9e3083fa1300aba63',
              'tests/integration/native_hostent_fixture.py': '30f01e154725bcfb9ea4676eacdf6927e48cdd6c',
          }
          tmp = Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(tmp / 'hostent.tar.gz') as archive:
              assert {m.name for m in archive} == expected.keys()
              for member in archive:
                  assert member.isfile()
                  data = archive.extractfile(member).read()
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == expected[member.name]
                  target = Path(member.name) if '/' in member.name else tmp / member.name
                  if '/' in member.name:
                      assert not target.exists(), f'concurrent file exists: {target}'
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          # The candidate committed after validation is an ordinary read-only CI
          # workflow. Remove only explicitly marked transient validation blocks.
          workflow = Path('.github/workflows/native-hostent.yml')
          lines, skipping = [], False
          for line in workflow.read_text().splitlines(True):
              if line.strip() == '# BEGIN HOSTENT CANDIDATE':
                  assert not skipping
                  skipping = True
              elif line.strip() == '# END HOSTENT CANDIDATE':
                  assert skipping
                  skipping = False
              elif not skipping:
                  lines.append(line)
          assert not skipping
          workflow.write_text(''.join(lines))
          PY
          git apply --check "$RUNNER_TEMP/core.patch" "$RUNNER_TEMP/abi.patch"
          git apply "$RUNNER_TEMP/core.patch" "$RUNNER_TEMP/abi.patch"
          python3 "$RUNNER_TEMP/wire_name2.py"
      # END HOSTENT CANDIDATE
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Compile and execute legacy host results and existing DNS tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/hostent
          cargo test -p frankenlibc-core --lib dns_transport:: -- --nocapture 2>&1 | tee artifacts/hostent/core.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/hostent/core.log
          cargo test -p frankenlibc-abi --test resolv_abi_test gethostbyname_numeric_ipv4_returns_hostent -- --exact --nocapture 2>&1 | tee artifacts/hostent/legacy-test.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' artifacts/hostent/legacy-test.log
          cargo check -p frankenlibc-abi --lib --keep-going 2>&1 | tee artifacts/hostent/abi-check.log
      - name: Build release legacy exports and C caller
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p frankenlibc-abi --lib 2>&1 | tee artifacts/hostent/build.log
          cc -Wall -Wextra -Werror tests/integration/fixture_native_hostent.c -ldl -o target/native-hostent-abi
          python3 -m py_compile tests/integration/native_hostent_fixture.py
          nm -D --defined-only target/release/libfrankenlibc_abi.so > artifacts/hostent/exports.txt
          for symbol in gethostbyname gethostbyname2 gethostbyaddr gethostbyname_r gethostbyname2_r gethostbyaddr_r; do
            grep -E "[[:space:]]$symbol(@@[^[:space:]]+)?$" artifacts/hostent/exports.txt
          done
      - name: Exercise all six C APIs in eight isolated runtime combinations
        shell: bash
        run: |
          set -euo pipefail
          printf 'nameserver 127.0.0.1\noptions timeout:1 attempts:1\n' > artifacts/hostent/resolv-udp.conf
          printf 'nameserver 127.0.0.1\noptions timeout:1 attempts:1 use-vc\n' > artifacts/hostent/resolv-tcp.conf
          printf '127.0.0.1 localhost\n192.0.2.200 files4.test file-alias\n2001:0DB8:0000:0000:0000:0000:0000:0200 files6.test file-alias\n' > artifacts/hostent/hosts
          status=0
          for transport in udp tcp; do
            for loading in dlopen preload; do
              extra=()
              if [[ "$transport" == tcp ]]; then extra+=(--tcp-only); fi
              if [[ "$loading" == preload ]]; then extra+=(--preload); fi
              for mode in strict hardened; do
                log="artifacts/hostent/abi-$transport-$loading-$mode.log"
                if ! sudo -n unshare --mount --net -- bash -eu -c '
                  mount --make-rprivate /
                  ip link set lo up
                  mount --bind "$1" /etc/resolv.conf
                  mount --bind "$2" /etc/hosts
                  export FRANKENLIBC_MODE="$3"
                  exec python3 "$4" "$5" "$6" "${@:7}"
                ' bash \
                  "$PWD/artifacts/hostent/resolv-$transport.conf" "$PWD/artifacts/hostent/hosts" "$mode" \
                  "$PWD/tests/integration/native_hostent_fixture.py" "$PWD/target/native-hostent-abi" \
                  "$PWD/target/release/libfrankenlibc_abi.so" "${extra[@]}" 2>&1 | tee "$log"; then status=1; fi
                if ! grep -Eq 'native hostent ABI: [1-9][0-9]* passed' "$log"; then status=1; fi
              done
            done
          done
          exit "$status"
      # BEGIN HOSTENT CANDIDATE
      - name: Preserve complete source and exact integration diff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in crates/frankenlibc-core/src/dns_transport.rs crates/frankenlibc-core/src/dns_transport/host.rs crates/frankenlibc-abi/src/resolv_abi.rs crates/frankenlibc-abi/src/resolv_abi/legacy_hostent.rs crates/frankenlibc-abi/src/unistd_abi.rs crates/frankenlibc-abi/tests/resolv_abi_test.rs tests/integration/fixture_native_hostent.c tests/integration/native_hostent_fixture.py .github/workflows/native-hostent.yml AGENTS.md PLAN_TO_PORT_GLIBC_TO_RUST.md .beads/issues.jsonl; do
            if [[ -f "$path" ]]; then
              mkdir -p "artifacts/hostent/source/$(dirname "$path")"
              cp "$path" "artifacts/hostent/source/$path"
            fi
          done
          git diff > artifacts/hostent/integration.diff
      - name: Publish validated source objects without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for path in crates/frankenlibc-core/src/dns_transport.rs crates/frankenlibc-core/src/dns_transport/host.rs crates/frankenlibc-abi/src/resolv_abi.rs crates/frankenlibc-abi/src/resolv_abi/legacy_hostent.rs crates/frankenlibc-abi/src/unistd_abi.rs tests/integration/fixture_native_hostent.c tests/integration/native_hostent_fixture.py; do
            blob=$(jq -Rs '{content: ., encoding:"utf-8"}' "$path" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            test "$blob" = "$(git hash-object "$path")"
            printf '%s %s\n' "$blob" "$path" | tee -a artifacts/hostent/published-blobs.txt
          done
      # END HOSTENT CANDIDATE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-hostent-results
          path: artifacts/hostent/**
          include-hidden-files: true
