name: GNU asynchronous DNS
on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-abi/src/gai_async.rs'
      - 'crates/frankenlibc-abi/src/aio_completion.rs'
      - 'crates/frankenlibc-abi/src/unistd_abi.rs'
      - 'crates/frankenlibc-abi/src/resolv_abi.rs'
      - 'crates/frankenlibc-abi/tests/unistd_abi_test.rs'
      - 'crates/frankenlibc-core/src/addrinfo*'
      - 'crates/frankenlibc-core/src/addrinfo/**'
      - 'crates/frankenlibc-core/src/resolv/**'
      - 'tests/integration/fixture_gai_async*'
      - 'scripts/check_gai_async.py'
      - '.github/workflows/gai-async.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        feature: [default, owned-tls-cache]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      BUILD_FEATURE: ${{ matrix.feature }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Record exact committed source provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('artifacts/gai-async') / os.environ['BUILD_FEATURE']
          root.mkdir(parents=True, exist_ok=True)
          (root / 'revision.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          (root / 'rustc.txt').write_text(subprocess.check_output(['rustc', '--version', '--verbose'], text=True))
          names = ['crates/frankenlibc-abi/src/unistd_abi.rs',
                   'crates/frankenlibc-abi/src/aio_completion.rs',
                   'crates/frankenlibc-abi/src/gai_async.rs',
                   'crates/frankenlibc-abi/tests/unistd_abi_test.rs',
                   'tests/integration/fixture_gai_async.c',
                   'tests/integration/fixture_gai_async_blocked.c',
                   'scripts/check_gai_async.py']
          hashes = {}
          for name in names:
              data = pathlib.Path(name).read_bytes()
              out = root / 'source' / name
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(data)
              hashes[name] = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          (root / 'source-blobs.json').write_text(json.dumps(hashes, indent=2) + '\n')
          PY
      - name: Execute release DNS and existing AIO contracts
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/gai-async/$BUILD_FEATURE"
          args=()
          if [[ "$BUILD_FEATURE" != default ]]; then args=(--features "$BUILD_FEATURE"); fi
          cargo build --release -p frankenlibc-abi --lib "${args[@]}" 2>&1 | tee "$root/build.log"
          cp target/release/libfrankenlibc_abi.so "$root/libfrankenlibc_abi.so"
          # Root is used only to bind the fixture's loopback DNS port 53.
          # Resolver/NSS configuration remains in private artifact files.
          sudo python3 "$PWD/scripts/check_gai_async.py" "$PWD/target/release/libfrankenlibc_abi.so" --output "$PWD/$root/cases"
          python3 scripts/check_aio_completion.py "$PWD/target/release/libfrankenlibc_abi.so" --output "$root/aio-completion"
          for filter in getaddrinfo_a_ gai_; do
            cargo test -p frankenlibc-abi --test unistd_abi_test "$filter" "${args[@]}" -- --test-threads=1 2>&1 | tee "$root/$filter.log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$root/$filter.log"
          done
      - name: Verify execution used unchanged committed sources
        shell: bash
        run: |
          git diff --exit-code -- crates/frankenlibc-abi/src/unistd_abi.rs crates/frankenlibc-abi/src/aio_completion.rs crates/frankenlibc-abi/src/gai_async.rs crates/frankenlibc-abi/tests/unistd_abi_test.rs tests/integration/fixture_gai_async.c tests/integration/fixture_gai_async_blocked.c scripts/check_gai_async.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gai-async-${{ matrix.feature }}
          path: artifacts/gai-async/${{ matrix.feature }}/
          if-no-files-found: error
          retention-days: 7
