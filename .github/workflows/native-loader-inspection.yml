name: Native loader inspection

on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-abi/src/dlfcn*.rs'
      - 'crates/frankenlibc-abi/tests/dlfcn_native*'
      - 'crates/frankenlibc-core/src/elf/**'
      - 'tests/integration/fixture_native_inspection*'
      - 'scripts/check_native_loader_inspection.sh'
      - '.github/workflows/native-loader-inspection.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: native-loader-inspection-publish
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-loader-inspection
      - name: Native address inspection in strict and hardened modes
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-loader-inspection
          for mode in strict hardened; do
            FRANKENLIBC_MODE="$mode" timeout 1200 cargo test --keep-going -p frankenlibc-abi --test dlfcn_native_inspection_test -- --test-threads=1 2>&1 | tee "artifacts/native-loader-inspection/inspection-${mode}.log"
            grep -F 'test result: ok. 2 passed; 0 failed;' "artifacts/native-loader-inspection/inspection-${mode}.log"
          done
      - name: Owned TLS inspection configuration
        run: |
          set -euo pipefail
          FRANKENLIBC_MODE=strict timeout 1200 cargo test --keep-going -p frankenlibc-abi --features owned-tls-cache --test dlfcn_native_inspection_test -- --test-threads=1 2>&1 | tee artifacts/native-loader-inspection/inspection-owned-tls.log
          grep -F 'test result: ok. 2 passed; 0 failed;' artifacts/native-loader-inspection/inspection-owned-tls.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-loader-inspection-${{ github.run_attempt }}
          path: artifacts/native-loader-inspection/
          if-no-files-found: warn
