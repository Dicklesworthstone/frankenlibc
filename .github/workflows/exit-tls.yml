name: Calling-thread exit destructors
on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-abi/src/exit_handlers.rs'
      - 'crates/frankenlibc-abi/src/stdlib_abi.rs'
      - 'crates/frankenlibc-abi/src/startup_abi.rs'
      - 'crates/frankenlibc-abi/src/pthread_abi.rs'
      - 'crates/frankenlibc-abi/src/process_abi.rs'
      - 'crates/frankenlibc-core/src/pthread/tls.rs'
      - 'crates/frankenlibc-core/src/syscall/mod.rs'
      - 'tests/integration/fixture_exit_tls*'
      - 'tests/integration/fixture_startup_thread_exit.c'
      - 'tests/integration/fixture_pthread_cancel.c'
      - 'crates/frankenlibc-abi/tests/conformance_diff_system_signals.rs'
      - 'scripts/check_exit_tls.py'
      - 'scripts/check_startup_thread_exit.py'
      - '.github/workflows/exit-tls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  destructors:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        feature: [default, owned-tls-cache]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build and execute unchanged release sources
        env:
          FEATURE: ${{ matrix.feature }}
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/exit-tls
          mkdir -p "$root"
          git rev-parse HEAD > "$root/revision.txt"
          rustc --version --verbose > "$root/rustc.txt"
          for file in exit_handlers.rs stdlib_abi.rs startup_abi.rs; do
            cp "crates/frankenlibc-abi/src/$file" "$root/$file"
            git hash-object "crates/frankenlibc-abi/src/$file" >> "$root/source-blobs.txt"
          done
          args=()
          if [[ "$FEATURE" != default ]]; then args=(--features "$FEATURE"); fi
          cargo build --release -p frankenlibc-abi --lib "${args[@]}" 2>&1 | tee "$root/build.log"
          cp target/release/libfrankenlibc_abi.so "$root/"
          cargo test -p frankenlibc-core --lib "${args[@]}" pthread::tls::tests::fork_child_ -- --test-threads=1 2>&1 | tee "$root/fork-keys.log"
          grep -Eq 'test result: ok\. 2 passed; 0 failed;' "$root/fork-keys.log"
          python3 scripts/check_startup_thread_exit.py "$PWD/target/release/libfrankenlibc_abi.so" --output "$root/startup"
          cc -O2 -pthread tests/integration/fixture_pthread_cancel.c -ldl -o "$root/pthread-cancel"
          for mode in strict hardened; do
            for scenario in self worker; do
              timeout --kill-after=2s 10s env LD_PRELOAD="$PWD/target/release/libfrankenlibc_abi.so" \
                FRANKENLIBC_MODE="$mode" FRANKENLIBC_THREAD_NATIVE=0 FRANKENLIBC_STARTUP_DELEGATE=0 \
                "$root/pthread-cancel" main-thread "$scenario" > "$root/main-$mode-$scenario.log"
            done
          done
          python3 scripts/check_exit_tls.py "$PWD/target/release/libfrankenlibc_abi.so" --output "$root/tls"
          python3 scripts/check_exit_tickets.py "$PWD/target/release/libfrankenlibc_abi.so" --output "$root/exit"
          cargo test -p frankenlibc-abi --test dlfcn_native_cxa_test "${args[@]}" -- --test-threads=1 2>&1 | tee "$root/cxa.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$root/cxa.log"
          git diff --exit-code -- crates/frankenlibc-abi/src tests/integration/fixture_exit_tls* tests/integration/fixture_startup_thread_exit.c tests/integration/fixture_pthread_cancel.c scripts/check_exit_tls.py scripts/check_startup_thread_exit.py
      - name: Preserve system signal dispositions across concurrent calls and cancellation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/exit-tls/system-signals
          library="$PWD/target/release/libfrankenlibc_abi.so"
          test -f "$library"
          mkdir -p "$root"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/integration/fixture_pthread_cancel.c -ldl -o "$root/probe"
          sha256sum "$library" "$root/probe" tests/integration/fixture_pthread_cancel.c > "$root/inputs.sha256"
          for scenario in inherited-int inherited-quit overlap-first overlap-second cancel-first cancel-second; do
            env -u LD_PRELOAD -u FRANKENLIBC_TEST_LIBRARY -u FRANKENLIBC_MODE \
              timeout --kill-after=2s 10s "$root/probe" system-signals "$scenario" \
              > "$root/$scenario-host.out" 2> "$root/$scenario-host.err"
            grep -qx "PASS system-signals $scenario" "$root/$scenario-host.out"
            test ! -s "$root/$scenario-host.err"
            for backend in 0 1; do
              for mode in strict hardened; do
                timeout --kill-after=2s 10s env LD_PRELOAD="$library" \
                  FRANKENLIBC_TEST_LIBRARY="$library" FRANKENLIBC_MODE="$mode" \
                  FRANKENLIBC_THREAD_NATIVE="$backend" \
                  "$root/probe" system-signals "$scenario" \
                  > "$root/$scenario-$backend-$mode.out" 2> "$root/$scenario-$backend-$mode.err"
                cmp "$root/$scenario-host.out" "$root/$scenario-$backend-$mode.out"
                cmp "$root/$scenario-host.err" "$root/$scenario-$backend-$mode.err"
              done
            done
          done
          set +e
          env -u LD_PRELOAD FRANKENLIBC_TEST_LIBRARY="$library" \
            timeout --kill-after=2s 10s "$root/probe" system-signals overlap-first \
            > "$root/provider-negative.out" 2> "$root/provider-negative.err"
          status=$?
          set -e
          test "$status" -eq 90
          grep -qx 'system signal contract: wrong symbol provider' "$root/provider-negative.err"
          echo 'system signals: 6 GNU cases, 24 candidate cases, 1 provider negative passed'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-tls-${{ matrix.feature }}
          path: artifacts/exit-tls/
          if-no-files-found: error
          retention-days: 7
