name: Native pthread stacks

on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-abi/src/pthread_abi.rs'
      - 'crates/frankenlibc-abi/src/pthread_cancel_wait.rs'
      - 'crates/frankenlibc-abi/src/pthread_cancel_poll.rs'
      - 'crates/frankenlibc-abi/src/signal_abi.rs'
      - 'crates/frankenlibc-abi/src/host_resolve.rs'
      - 'crates/frankenlibc-abi/src/poll_abi.rs'
      - 'crates/frankenlibc-abi/src/socket_abi.rs'
      - 'crates/frankenlibc-abi/src/fortify_abi.rs'
      - 'crates/frankenlibc-abi/src/time_abi.rs'
      - 'crates/frankenlibc-abi/src/c11threads_abi.rs'
      - 'crates/frankenlibc-abi/src/glibc_internal_abi.rs'
      - 'crates/frankenlibc-abi/src/iov_snapshot.rs'
      - 'crates/frankenlibc-abi/src/semaphore_wait.rs'
      - 'crates/frankenlibc-abi/src/runtime_policy.rs'
      - 'crates/frankenlibc-abi/src/owned_tls_cache.rs'
      - 'crates/frankenlibc-abi/src/malloc_abi.rs'
      - 'crates/frankenlibc-abi/src/errno_abi.rs'
      - 'crates/frankenlibc-abi/src/mqueue_notify.rs'
      - 'crates/frankenlibc-abi/src/posix_timer.rs'
      - 'crates/frankenlibc-abi/src/unistd_abi.rs'
      - 'crates/frankenlibc-abi/tests/pthread_stack_abi_test.rs'
      - 'crates/frankenlibc-abi/tests/pthread_cancel_wait_test.rs'
      - 'crates/frankenlibc-abi/tests/pthread_thread_lifecycle_test.rs'
      - 'crates/frankenlibc-abi/tests/time_abi_test.rs'
      - 'crates/frankenlibc-core/src/pthread/**'
      - 'crates/frankenlibc-core/src/syscall/**'
      - 'tests/integration/fixture_pthread.c'
      - 'tests/integration/fixture_pthread_key_destructors.c'
      - 'tests/integration/fixture_posix_timers.c'
      - 'scripts/check_pthread_extensions_native.sh'
      - 'scripts/check_posix_timers.py'
      - '.github/workflows/native-pthread-stacks.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tests/integration/fixture_pthread_native_state.c'
      - 'tests/integration/fixture_pthread_native_wait.c'
      - 'tests/integration/fixture_pthread_native_poll.c'
      - 'scripts/check_pthread_native_poll.py'
      - 'tests/integration/fixture_cancel_forced_unwind.cpp'
      - 'tests/integration/fixture_runtime_ready_arm.cpp'
      - 'scripts/check_pthread_native_state.py'
      - 'scripts/check_runtime_ready_arm_e2e.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signal-waits:
    runs-on: ubuntu-24.04
    # The signal-mask cleanup oracle was established against GNU libc 2.41.
    # Keep that baseline explicit: Ubuntu 24.04 uses older cancellation wrappers.
    container: debian:13
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        feature: [default, owned-tls-cache]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - name: Install GNU 2.41 build and fixture dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config python3
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build actual signal-wait entrypoints
        env:
          FEATURE: ${{ matrix.feature }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/signal-waits
          git rev-parse HEAD > artifacts/signal-waits/revision.txt
          getconf GNU_LIBC_VERSION > artifacts/signal-waits/gnu-libc.txt
          rustc --version --verbose > artifacts/signal-waits/rustc.txt
          args=()
          if [[ "$FEATURE" != default ]]; then args=(--features "$FEATURE"); fi
          cargo build --release -p frankenlibc-abi --lib "${args[@]}" \
            2>&1 | tee artifacts/signal-waits/build.log
      # Keep these regressions independent of the broader native-poll gate:
      # an unrelated failure there must not skip signal-wait execution.
      - name: Compare parked sigwait cancellation with live GNU libc
        shell: bash
        run: |
          python3 scripts/check_pthread_native_state.py --sigwait-only \
            --library "$PWD/target/release/libfrankenlibc_abi.so" \
            --out-dir "$PWD/artifacts/signal-waits/sigwait"
      - name: Compare pause and sigsuspend cancellation and masks with live GNU libc
        if: always()
        shell: bash
        run: |
          python3 scripts/check_pthread_native_poll.py --suspend-only \
            --library "$PWD/target/release/libfrankenlibc_abi.so" \
            --out-dir "$PWD/artifacts/signal-waits/suspend"
      - name: Compare blocked socket receives and cancellation with live GNU libc
        if: always()
        shell: bash
        run: |
          python3 scripts/check_pthread_native_poll.py --receive-only \
            --library "$PWD/target/release/libfrankenlibc_abi.so" \
            --out-dir "$PWD/artifacts/signal-waits/receive"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-waits-${{ matrix.feature }}
          path: |
            artifacts/signal-waits/
            target/release/libfrankenlibc_abi.so
          if-no-files-found: error
          retention-days: 7

  runtime-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        feature: [default, owned-tls-cache]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Initialize owned policy state during startup and fresh thread creation
        env:
          FEATURE: ${{ matrix.feature }}
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/runtime-startup
          mkdir -p "$root"
          git rev-parse HEAD > "$root/revision.txt"
          args=()
          if [[ "$FEATURE" != default ]]; then args=(--features "$FEATURE"); fi
          cargo build --release -p frankenlibc-abi --lib "${args[@]}" 2>&1 | tee "$root/build.log"
          bash scripts/check_runtime_ready_arm_e2e.sh \
            --library "$PWD/target/release/libfrankenlibc_abi.so" \
            --thread-backend hosted --out-dir "$root/hosted"
          bash scripts/check_runtime_ready_arm_e2e.sh \
            --library "$PWD/target/release/libfrankenlibc_abi.so" \
            --thread-backend native --case fresh-serial --out-dir "$root/native-serial"
          if [[ "$FEATURE" == owned-tls-cache ]]; then
            cargo test -p frankenlibc-abi --lib --features owned-tls-cache \
              owned_tls_cache::tests:: -- --test-threads=1 2>&1 | tee "$root/cache-owner.log"
            grep -Eq 'test result: ok\. 2 passed; 0 failed;' "$root/cache-owner.log"
            python3 scripts/check_pthread_native_poll.py \
              --library "$PWD/target/release/libfrankenlibc_abi.so" \
              --out-dir "$root/native-waits"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-startup-${{ matrix.feature }}
          path: artifacts/runtime-startup/
          if-no-files-found: error
          retention-days: 7

  stacks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      FRANKENLIBC_RUNTIME_MATH: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Execute native clone and public stack attribute contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          root = pathlib.Path('artifacts/pthread-stacks')
          root.mkdir(parents=True, exist_ok=True)
          cases = [('core', ['cargo', 'test', '-p', 'frankenlibc-core', '--lib',
                    'pthread::thread::tests::'], 'strict', 24),
                   ('cancel-wait', ['cargo', 'test', '-p', 'frankenlibc-abi',
                    '--test', 'pthread_cancel_wait_test', 'cancel_wait::tests::'], 'strict', 4),
                   ('cancel-poll', ['cargo', 'test', '-p', 'frankenlibc-abi',
                    '--test', 'pthread_cancel_wait_test', 'cancel_poll::tests::'], 'strict', 3)]
          for label, features in [('keys', []), ('keys-owned', ['--features', 'owned-tls-cache'])]:
              cases.append((label, ['cargo', 'test', '-p', 'frankenlibc-core', '--lib',
                  *features, 'pthread::tls::tests::'], 'strict', 50))
              for mode in ['strict', 'hardened']:
                  cases.append((f'policy-{label}-{mode}', ['cargo', 'test', '-p', 'frankenlibc-abi',
                      *features, '--test', 'pthread_thread_lifecycle_test',
                      'threading_policy_context_'], mode, 2))
          for mode in ['strict', 'hardened']:
              cases.append((mode, ['cargo', 'test', '-p', 'frankenlibc-abi',
                  '--test', 'pthread_stack_abi_test'], mode, 8))
              cases.append((f'clock-errors-{mode}', ['cargo', 'test', '-p', 'frankenlibc-abi',
                  '--test', 'time_abi_test',
                  'clock_nanosleep_thread_cpu_clock_matches_gnu_error_precedence'], mode, 1))
          failures = []
          for label, command, mode, count in cases:
              run = subprocess.run(command + ['--', '--nocapture', '--test-threads=1'],
                  env=dict(os.environ, FRANKENLIBC_MODE=mode), stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT, timeout=900)
              output = run.stdout.decode(errors='replace')
              (root / f'{label}.log').write_text(output)
              print(output[-14000:])
              if run.returncode or f'test result: ok. {count} passed; 0 failed;' not in output:
                  failures.append(label)
          assert not failures, failures
          PY
      - name: Record the tested revision and compiler
        if: always()
        run: |
          mkdir -p artifacts/pthread-stacks
          git rev-parse HEAD > artifacts/pthread-stacks/revision.txt
          rustc --version --verbose > artifacts/pthread-stacks/rustc.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pthread-stacks
          path: artifacts/pthread-stacks/
          if-no-files-found: error
          retention-days: 14

  startup-attributes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      FRANKENLIBC_RUNTIME_MATH: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build deployed pthread ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/conformance/pthread_startup
          cargo build --release -p frankenlibc-abi --lib 2>&1 \
            | tee target/conformance/pthread_startup/build.log
      - name: Compare blocked poll, epoll and sleep cancellation, readiness, remainders and signal masks against GNU libc
        shell: bash
        run: |
          python3 scripts/check_pthread_native_poll.py \
            --library "$PWD/target/release/libfrankenlibc_abi.so" \
            --out-dir "$PWD/target/conformance/pthread_native_poll"
      - name: Compare child execution attributes against live GNU pthreads
        shell: bash
        run: |
          FRANKENLIBC_TEST_LIBRARY="$PWD/target/release/libfrankenlibc_abi.so" \
            bash scripts/check_pthread_extensions_native.sh --startup-attributes
      - name: Compare key destruction and minimum native stacks against GNU pthreads
        shell: bash
        run: |
          FRANKENLIBC_TEST_LIBRARY="$PWD/target/release/libfrankenlibc_abi.so" \
            bash scripts/check_pthread_extensions_native.sh --key-destructors
      - name: Compare native errno, cancellation, and C/C++ cleanup against GNU pthreads
        shell: bash
        run: |
          python3 scripts/check_pthread_native_state.py \
            --library "$PWD/target/release/libfrankenlibc_abi.so" \
            --out-dir "$PWD/target/conformance/pthread_native_state"
      - name: Compare POSIX timer and message-queue callbacks against GNU libc
        shell: bash
        run: |
          python3 scripts/check_posix_timers.py \
            --library "$PWD/target/release/libfrankenlibc_abi.so" \
            --out-dir "$PWD/target/conformance/posix_timers" \
            --require-kernel-accounting
      - name: Record the tested revision and compiler
        if: always()
        run: |
          mkdir -p target/conformance/pthread_startup
          git rev-parse HEAD > target/conformance/pthread_startup/revision.txt
          rustc --version --verbose > target/conformance/pthread_startup/rustc.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pthread-startup-attributes
          path: |
            target/conformance/pthread_startup/
            target/conformance/pthread_keys/
            target/conformance/pthread_native_state/
            target/conformance/pthread_native_poll/
            target/conformance/posix_timers/
          if-no-files-found: error
          retention-days: 14
