name: Native semaphore lifecycle
on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-abi/src/*semaphore*'
      - 'crates/frankenlibc-abi/src/unistd_abi.rs'
      - 'crates/frankenlibc-abi/src/dlfcn*'
      - 'crates/frankenlibc-abi/tests/*semaphore*'
      - '.github/workflows/native-semaphore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
      - name: Execute real C semaphore protocols
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          set -euo pipefail
          cargo test -p frankenlibc-abi --test dlfcn_native_semaphore_test -- --test-threads=1
  validated-public-source:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'feat(loader): execute native semaphore lifecycle')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
      - name: Apply the reviewed exported-ABI integration
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess, urllib.request
          url = 'https://api.github.com/repos/Dicklesworthstone/frankenlibc/git/blobs/edb9a1fb2e116cfa8a5ce2d1d5656b6dd84c4db1'
          with urllib.request.urlopen(url, timeout=30) as response:
              blob = json.load(response)
          data = gzip.decompress(base64.b64decode(blob['content']))
          assert hashlib.sha256(data).hexdigest() == 'af134bd686ef4ae5e34b0620f0aa061785f6fbfb60dddef2060b3b081ced4029'
          path = pathlib.Path('/tmp/public-named.patch')
          path.write_bytes(data)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: Validate public and native semaphore state
        run: |
          set -euo pipefail
          mkdir -p artifacts/semaphore
          for mode in strict hardened; do
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi \
              --test named_semaphore_test --test dlfcn_native_semaphore_test \
              --test conformance_diff_semaphore -- --test-threads=1 \
              2>&1 | tee "artifacts/semaphore/${mode}.log"
          done
      - name: Upload validated blobs without modifying branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          paths = ['crates/frankenlibc-abi/src/unistd_abi.rs', 'crates/frankenlibc-abi/tests/named_semaphore_test.rs']
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          changed += subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', 'crates/'], text=True).splitlines()
          assert set(changed) == set(paths), changed
          results = []
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/frankenlibc/git/blobs', data=body, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              assert blob['sha'] == expected, path
              results.append({'path': path, 'sha': expected, 'bytes': len(data)})
          pathlib.Path('artifacts/semaphore/source-blobs.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-public-semaphore-source
          path: artifacts/semaphore/
