name: Native UDP RPC
on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-abi/src/rpc*.rs'
      - 'crates/frankenlibc-abi/src/iov_snapshot*.rs'
      - 'crates/frankenlibc-abi/tests/rpc*test.rs'
      - 'crates/frankenlibc-core/src/rpc/**'
      - 'crates/frankenlibc-core/src/stdio/file.rs'
      - '.github/workflows/rpc-udp-native.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-udp-rpc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  udp-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      FRANKENLIBC_RUNTIME_MATH: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Execute core RPC and stream-orientation contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          root = pathlib.Path('artifacts/rpc'); root.mkdir(parents=True, exist_ok=True)
          failures = []
          for selector, count in [('rpc::', 51), ('stdio::file::tests::', 43)]:
              run = subprocess.run(['cargo', 'test', '-p', 'frankenlibc-core', '--lib', selector,
                  '--', '--nocapture', '--test-threads=1'], stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT, timeout=900)
              text = run.stdout.decode(errors='replace')
              (root / (selector.replace(':', '_') + '.log')).write_text(text)
              print(text[-12000:])
              if run.returncode or f'test result: ok. {count} passed; 0 failed;' not in text:
                  failures.append(selector)
              if selector == 'rpc::' and text.count('test rpc::wire::portmap::tests::') != 5:
                  failures.append('missing bounded portmapper decoder tests')
          assert not failures, failures
          PY
      - name: Execute actual UDP client ABI and XDR regressions
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          root = pathlib.Path('artifacts/rpc'); root.mkdir(parents=True, exist_ok=True)
          failures = []
          for mode in ['strict', 'hardened']:
              for target in ['rpc_udp_transport_test', 'rpc_abi_test', 'rpc_portmap_test']:
                  run = subprocess.run(['cargo', 'test', '-p', 'frankenlibc-abi', '--test', target,
                      '--', '--nocapture', '--test-threads=1'], env=dict(os.environ, FRANKENLIBC_MODE=mode),
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=900)
                  text = run.stdout.decode(errors='replace')
                  (root / f'{target}-{mode}.log').write_text(text)
                  print(f'{mode}/{target}: exit={run.returncode}')
                  print('\n'.join(line for line in text.splitlines() if 'test result:' in line or 'NATIVE UDP RPC:' in line))
                  if run.returncode or not re.search(r'test result: ok\. [1-9][0-9]* passed; 0 failed;', text):
                      failures.append(f'{mode}/{target}'); print(text[-14000:])
                  if target == 'rpc_udp_transport_test' and 'NATIVE UDP RPC: 46 isolated ABI cases passed' not in text:
                      failures.append(f'{mode}/missing client execution')
          assert not failures, failures
          PY
      - name: Execute actual portmapper operations in both modes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('artifacts/rpc')
          for target, test in [
              ('rpc_udp_transport_test', 'portmapper_discovery_and_registration_use_actual_abi'),
              ('rpc_portmap_test', 'portmapper_dump_and_callit_use_actual_abi'),
          ]:
              build = subprocess.run(['cargo', 'test', '-p', 'frankenlibc-abi', '--test',
                  target, '--no-run', '--message-format=json'],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=900)
              (root / f'{target}-build.log').write_text(build.stderr)
              assert build.returncode == 0, build.stderr[-12000:]
              executables = []
              for line in build.stdout.splitlines():
                  try: message = json.loads(line)
                  except json.JSONDecodeError: continue
                  if message.get('reason') == 'compiler-artifact' and message.get('executable'):
                      if message['target']['name'] == target:
                          executables.append(message['executable'])
              assert len(executables) == 1, executables
              for mode in ['strict', 'hardened']:
                  run = subprocess.run(['sudo', 'env', 'FRANKENLIBC_MODE=' + mode,
                      'FRANKENLIBC_RUNTIME_MATH=off', 'timeout', '30s', executables[0],
                      '--exact', test, '--ignored', '--nocapture', '--test-threads=1'],
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=45)
                  text = run.stdout.decode(errors='replace')
                  (root / f'{target}-{mode}-port111.log').write_text(text)
                  print(text)
                  assert run.returncode == 0 and 'test result: ok. 1 passed; 0 failed;' in text
                  if target == 'rpc_portmap_test':
                      assert 'NATIVE PORTMAPPER: 18 wire, callback, ownership and unwind cases passed' in text
          PY
      - name: Preserve tested source and compiler provenance
        if: always()
        run: |
          mkdir -p artifacts/rpc
          git rev-parse HEAD > artifacts/rpc/revision.txt
          rustc --version --verbose > artifacts/rpc/rustc.txt
          git archive --format=tar.gz HEAD > artifacts/rpc/tested-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-udp-rpc-results
          path: artifacts/rpc/**
          if-no-files-found: error
          retention-days: 14
