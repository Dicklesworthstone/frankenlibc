name: Native loader execution

on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-abi/src/dlfcn*'
      - 'crates/frankenlibc-abi/tests/dlfcn*'
      - 'crates/frankenlibc-core/src/elf/**'
      - '.github/workflows/native-loader.yml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/frankenlibc-abi/src/dlfcn*'
      - 'crates/frankenlibc-abi/tests/dlfcn*'
      - 'crates/frankenlibc-core/src/elf/**'
      - '.github/workflows/native-loader.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native-dso-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [strict, hardened]
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      FRANKENLIBC_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - name: Prove nested-finalizer regression rejects the retained collector
        run: |
          mkdir -p artifacts/native-loader
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          saved=$(mktemp)
          cp "$source" "$saved"
          trap 'cp "$saved" "$source"' EXIT
          git fetch --no-tags --depth=1 origin 13ad4eadeb7cba5d3de21825d3154bfaa0409a98
          git show 13ad4eadeb7cba5d3de21825d3154bfaa0409a98:"$source" > "$source"
          set +e
          cargo test -p frankenlibc-abi --test dlfcn_native_lifecycle_test \
            native_lifecycle_callbacks_can_reenter_loader -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/retained-collector-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'left: [10, 1, 20, -20, -1, -10]' "artifacts/native-loader/retained-collector-${FRANKENLIBC_MODE}.log"
          grep -F 'right: [10, 1, 20, -20, -10, -1]' "artifacts/native-loader/retained-collector-${FRANKENLIBC_MODE}.log"
      - name: Execute native loader suites without hiding later targets on failure
        run: |
          mkdir -p artifacts/native-loader
          cargo test -p frankenlibc-abi --no-fail-fast \
            --test dlfcn_abi_test --test dlfcn_native_dependencies_test \
            --test dlfcn_native_search_test --test dlfcn_native_lifecycle_test \
            -- --test-threads=1 2>&1 | tee "artifacts/native-loader/${FRANKENLIBC_MODE}.log"
      - name: Isolate host version lookup regression
        if: always()
        run: |
          mkdir -p artifacts/native-loader
          cargo test -p frankenlibc-abi --test dlfcn_abi_test \
            dlvsym_host_handle_resolves_symbol -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/host-version-${FRANKENLIBC_MODE}.log"
      - name: Preserve execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-loader-execution-${{ matrix.mode }}
          path: artifacts/native-loader/
          if-no-files-found: error
