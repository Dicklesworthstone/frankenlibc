name: Native loader execution

on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-abi/src/dlfcn*'
      - 'crates/frankenlibc-abi/src/glibc_internal_abi.rs'
      - 'crates/frankenlibc-abi/src/malloc_abi.rs'
      - 'crates/frankenlibc-abi/tests/dlfcn*'
      - 'crates/frankenlibc-abi/tests/native_loader_hwcaps_test.rs'
      - 'crates/frankenlibc-abi/src/util.rs'
      - 'crates/frankenlibc-core/src/pthread/**'
      - 'crates/frankenlibc-abi/examples/dlfcn_native_process_exit_probe.rs'
      - 'crates/frankenlibc-abi/tests/fixtures/tlsdesc_state_probe.S'
      - 'crates/frankenlibc-core/src/elf/**'
      - '.github/workflows/native-loader.yml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/frankenlibc-abi/src/dlfcn*'
      - 'crates/frankenlibc-abi/src/glibc_internal_abi.rs'
      - 'crates/frankenlibc-abi/src/malloc_abi.rs'
      - 'crates/frankenlibc-abi/tests/dlfcn*'
      - 'crates/frankenlibc-abi/tests/native_loader_hwcaps_test.rs'
      - 'crates/frankenlibc-abi/src/util.rs'
      - 'crates/frankenlibc-core/src/pthread/**'
      - 'crates/frankenlibc-abi/examples/dlfcn_native_process_exit_probe.rs'
      - 'crates/frankenlibc-abi/tests/fixtures/tlsdesc_state_probe.S'
      - 'crates/frankenlibc-core/src/elf/**'
      - '.github/workflows/native-loader.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  public-dynamic-tls-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - storage: default
            features: conformance-testing
          - storage: owned
            features: conformance-testing,owned-tls-cache
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      ABI_FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: public-dynamic-tls-${{ matrix.storage }}
      - name: Execute public dispatch and owned resolver component regressions
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-dynamic-tls
          # Each case runs strict and hardened subprocesses. The conformance
          # hook exercises the same body used by standalone public dispatch;
          # this hosted job does not bypass standalone admission.
          cargo test -p frankenlibc-abi --features "$ABI_FEATURES" \
            --test dlfcn_native_tls_test public_dynamic_tls_resolver_ \
            -- --nocapture --test-threads=1 \
            2>&1 | tee artifacts/public-dynamic-tls/execution.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' \
            artifacts/public-dynamic-tls/execution.log
      - name: Preserve hosted loader TLS across first native thread admission
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-dynamic-tls
          # Each exact test executes independent GNU/native providers in
          # strict and hardened children, checking real C++ TLS destructors.
          cargo test -p frankenlibc-abi --features "$ABI_FEATURES" \
            --test dlfcn_native_thread_exit_test \
            hosted_loader_tls_survives_first_native_thread_creation \
            -- --exact --nocapture --test-threads=1 \
            2>&1 | tee artifacts/public-dynamic-tls/mixed-hosted-owner.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' \
            artifacts/public-dynamic-tls/mixed-hosted-owner.log
      - name: Preserve explicit loader namespace isolation
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-dynamic-tls
          for mode in strict hardened; do
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi --features "$ABI_FEATURES" \
              --test dlfcn_abi_test dlmopen_ -- --nocapture --test-threads=1 \
              2>&1 | tee "artifacts/public-dynamic-tls/namespaces-$mode.log"
            grep -Eq '^test result: ok\. 3 passed; 0 failed; 0 ignored;' \
              "artifacts/public-dynamic-tls/namespaces-$mode.log"
          done
      - name: Preserve public TLS execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-dynamic-tls-${{ matrix.storage }}
          path: artifacts/public-dynamic-tls/
          if-no-files-found: error

  native-dso-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [strict, hardened]
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      FRANKENLIBC_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - name: Prove nested-finalizer regression rejects the retained collector
        run: |
          mkdir -p artifacts/native-loader
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          search=crates/frankenlibc-abi/src/dlfcn_search.rs
          saved=$(mktemp)
          saved_search=$(mktemp)
          cp "$source" "$saved"
          cp "$search" "$saved_search"
          trap 'cp "$saved" "$source"; cp "$saved_search" "$search"' EXIT
          git fetch --no-tags --depth=1 origin 13ad4eadeb7cba5d3de21825d3154bfaa0409a98
          git show 13ad4eadeb7cba5d3de21825d3154bfaa0409a98:"$source" > "$source"
          git show 13ad4eadeb7cba5d3de21825d3154bfaa0409a98:"$search" > "$search"
          set +e
          cargo test -p frankenlibc-abi --test dlfcn_native_lifecycle_test \
            native_lifecycle_callbacks_can_reenter_loader -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/retained-collector-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'left: [10, 1, 20, -20, -1, -10]' "artifacts/native-loader/retained-collector-${FRANKENLIBC_MODE}.log"
          grep -F 'right: [10, 1, 20, -20, -10, -1]' "artifacts/native-loader/retained-collector-${FRANKENLIBC_MODE}.log"
      - name: Prove native TLS regression rejects the retained loader
        run: |
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          search=crates/frankenlibc-abi/src/dlfcn_search.rs
          saved=$(mktemp)
          saved_search=$(mktemp)
          cp "$source" "$saved"
          cp "$search" "$saved_search"
          trap 'cp "$saved" "$source"; cp "$saved_search" "$search"' EXIT
          git fetch --no-tags --depth=1 origin 5b0ee5fd125b0458bf32e91d6c05c4c94cacea9a
          git show 5b0ee5fd125b0458bf32e91d6c05c4c94cacea9a:"$source" > "$source"
          git show 5b0ee5fd125b0458bf32e91d6c05c4c94cacea9a:"$search" > "$search"
          set +e
          cargo test -p frankenlibc-abi --test dlfcn_native_tls_test \
            native_tls_data_bss_alignment_and_dlsym_match_host -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/retained-tls-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'TLS fixture was rejected by native loader' "artifacts/native-loader/retained-tls-${FRANKENLIBC_MODE}.log"
      - name: Prove native IFUNC execution rejects the retained loader
        run: |
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          search=crates/frankenlibc-abi/src/dlfcn_search.rs
          tls=crates/frankenlibc-abi/src/dlfcn_tls.rs
          saved=$(mktemp -d)
          cp "$source" "$saved/native"
          cp "$search" "$saved/search"
          cp "$tls" "$saved/tls"
          trap 'cp "$saved/native" "$source"; cp "$saved/search" "$search"; cp "$saved/tls" "$tls"' EXIT
          git fetch --no-tags --depth=1 origin e0d814633691925f962e58e642e079df1bb93f23
          git show e0d814633691925f962e58e642e079df1bb93f23:"$source" > "$source"
          git show e0d814633691925f962e58e642e079df1bb93f23:"$search" > "$search"
          git show e0d814633691925f962e58e642e079df1bb93f23:"$tls" > "$tls"
          set +e
          cargo test -p frankenlibc-abi --test dlfcn_native_ifunc_test \
            native_ifunc_data_got_plt_and_lookup_match_host -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/retained-ifunc-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'IFUNC fixture must load natively' "artifacts/native-loader/retained-ifunc-${FRANKENLIBC_MODE}.log"
      - name: Prove preemption regression rejects definition-first binding
        run: |
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          search=crates/frankenlibc-abi/src/dlfcn_search.rs
          ifunc=crates/frankenlibc-abi/src/dlfcn_ifunc.rs
          tls=crates/frankenlibc-abi/src/dlfcn_tls.rs
          saved=$(mktemp -d)
          cp "$source" "$saved/native"
          cp "$search" "$saved/search"
          cp "$ifunc" "$saved/ifunc"
          cp "$tls" "$saved/tls"
          trap 'cp "$saved/native" "$source"; cp "$saved/search" "$search"; cp "$saved/ifunc" "$ifunc"; cp "$saved/tls" "$tls"' EXIT
          git fetch --no-tags --depth=1 origin d0ebbac95d459830fc4f367f477162f5f8a67ab7
          git show d0ebbac95d459830fc4f367f477162f5f8a67ab7:"$source" > "$source"
          git show d0ebbac95d459830fc4f367f477162f5f8a67ab7:"$search" > "$search"
          git show d0ebbac95d459830fc4f367f477162f5f8a67ab7:"$ifunc" > "$ifunc"
          git show d0ebbac95d459830fc4f367f477162f5f8a67ab7:"$tls" > "$tls"
          set +e
          cargo test -p frankenlibc-abi --test dlfcn_native_binding_test \
            native_binding_preempts_own_data_and_function_definitions -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/retained-binding-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'default-visible definitions must be preempted' "artifacts/native-loader/retained-binding-${FRANKENLIBC_MODE}.log"
          grep -F 'left: 15' "artifacts/native-loader/retained-binding-${FRANKENLIBC_MODE}.log"
          grep -F 'right: 81' "artifacts/native-loader/retained-binding-${FRANKENLIBC_MODE}.log"
      - name: Prove TLSDESC execution rejects the retained loader
        run: |
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          search=crates/frankenlibc-abi/src/dlfcn_search.rs
          tls=crates/frankenlibc-abi/src/dlfcn_tls.rs
          saved=$(mktemp -d)
          cp "$source" "$saved/native"
          cp "$search" "$saved/search"
          cp "$tls" "$saved/tls"
          trap 'cp "$saved/native" "$source"; cp "$saved/search" "$search"; cp "$saved/tls" "$tls"' EXIT
          git fetch --no-tags --depth=1 origin d21f379b4e97ff30cbfd114d96b85a396e9fe74b
          git show d21f379b4e97ff30cbfd114d96b85a396e9fe74b:"$source" > "$source"
          git show d21f379b4e97ff30cbfd114d96b85a396e9fe74b:"$search" > "$search"
          git show d21f379b4e97ff30cbfd114d96b85a396e9fe74b:"$tls" > "$tls"
          set +e
          cargo test -p frankenlibc-abi --test dlfcn_native_tlsdesc_test \
            native_tlsdesc_data_bss_alignment_and_dlsym_match_host -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/retained-tlsdesc-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'TLSDESC fixture must load natively' "artifacts/native-loader/retained-tlsdesc-${FRANKENLIBC_MODE}.log"
          grep -E 'test result: FAILED.*1 failed' "artifacts/native-loader/retained-tlsdesc-${FRANKENLIBC_MODE}.log"
      - name: Prove C++ termination rejects the retained loader
        run: |
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          search=crates/frankenlibc-abi/src/dlfcn_search.rs
          saved=$(mktemp)
          saved_search=$(mktemp)
          cp "$source" "$saved"
          cp "$search" "$saved_search"
          trap 'cp "$saved" "$source"; cp "$saved_search" "$search"' EXIT
          git fetch --no-tags --depth=1 origin b30fec3a1b73db1f8c9127c944fc2c13dea80860
          git show b30fec3a1b73db1f8c9127c944fc2c13dea80860:"$source" > "$source"
          git show b30fec3a1b73db1f8c9127c944fc2c13dea80860:"$search" > "$search"
          set +e
          cargo test -p frankenlibc-abi --test dlfcn_native_cxa_test \
            native_cxa_real_cpp_static_objects_execute_and_reload -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/retained-cxa-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'C++ fixture failed to load:' "artifacts/native-loader/retained-cxa-${FRANKENLIBC_MODE}.log"
          grep -E 'test result: FAILED.*1 failed' "artifacts/native-loader/retained-cxa-${FRANKENLIBC_MODE}.log"
      - name: Prove process termination rejects the retained loader
        run: |
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          search=crates/frankenlibc-abi/src/dlfcn_search.rs
          saved=$(mktemp)
          saved_search=$(mktemp)
          cp "$source" "$saved"
          cp "$search" "$saved_search"
          trap 'cp "$saved" "$source"; cp "$saved_search" "$search"' EXIT
          git fetch --no-tags --depth=1 origin 16bb0e41ae6134faa4ce3385f5f4aefed5029a45
          git show 16bb0e41ae6134faa4ce3385f5f4aefed5029a45:"$source" > "$source"
          git show 16bb0e41ae6134faa4ce3385f5f4aefed5029a45:"$search" > "$search"
          set +e
          cargo run -p frankenlibc-abi --example dlfcn_native_process_exit_probe -- --only plain-return \
            2>&1 | tee "artifacts/native-loader/retained-process-exit-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'native process-exit trace mismatch: native plain-return' "artifacts/native-loader/retained-process-exit-${FRANKENLIBC_MODE}.log"
          grep -F 'left: [76, 82, 77]' "artifacts/native-loader/retained-process-exit-${FRANKENLIBC_MODE}.log"
          grep -F 'right: [76, 82, 77, 114, 108]' "artifacts/native-loader/retained-process-exit-${FRANKENLIBC_MODE}.log"
      - name: Execute native loader suites without hiding later targets on failure
        if: always()
        run: |
          mkdir -p artifacts/native-loader
          cargo test -p frankenlibc-abi --no-fail-fast \
            --test dlfcn_abi_test --test dlfcn_native_dependencies_test \
            --test dlfcn_native_search_test --test dlfcn_native_lifecycle_test \
            --test dlfcn_native_tls_test --test dlfcn_native_thread_exit_test \
            --test dlfcn_native_ifunc_test --test dlfcn_native_binding_test \
            --test dlfcn_native_tlsdesc_test --test dlfcn_native_cxa_test \
            -- --test-threads=1 2>&1 | tee "artifacts/native-loader/${FRANKENLIBC_MODE}.log"
      - name: Execute real main and worker process termination
        if: always()
        run: |
          mkdir -p artifacts/native-loader
          cargo run -p frankenlibc-abi --example dlfcn_native_process_exit_probe \
            2>&1 | tee "artifacts/native-loader/process-exit-${FRANKENLIBC_MODE}.log"
          grep -F 'native-process-exit: 39 scenarios passed' "artifacts/native-loader/process-exit-${FRANKENLIBC_MODE}.log"
      - name: Isolate host version lookup regression
        if: always()
        run: |
          mkdir -p artifacts/native-loader
          cargo test -p frankenlibc-abi --test dlfcn_abi_test \
            dlvsym_host_handle_resolves_symbol -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/host-version-${FRANKENLIBC_MODE}.log"
      - name: Preserve execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-loader-execution-${{ matrix.mode }}
          path: artifacts/native-loader/
          if-no-files-found: error
