name: Native loader execution

on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-abi/src/dlfcn*'
      - 'crates/frankenlibc-abi/tests/dlfcn*'
      - 'crates/frankenlibc-abi/tests/fixtures/tlsdesc_state_probe.S'
      - 'crates/frankenlibc-core/src/elf/**'
      - '.github/workflows/native-loader.yml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/frankenlibc-abi/src/dlfcn*'
      - 'crates/frankenlibc-abi/tests/dlfcn*'
      - 'crates/frankenlibc-abi/tests/fixtures/tlsdesc_state_probe.S'
      - 'crates/frankenlibc-core/src/elf/**'
      - '.github/workflows/native-loader.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native-dso-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [strict, hardened]
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      FRANKENLIBC_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - name: Prove nested-finalizer regression rejects the retained collector
        run: |
          mkdir -p artifacts/native-loader
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          saved=$(mktemp)
          cp "$source" "$saved"
          trap 'cp "$saved" "$source"' EXIT
          git fetch --no-tags --depth=1 origin 13ad4eadeb7cba5d3de21825d3154bfaa0409a98
          git show 13ad4eadeb7cba5d3de21825d3154bfaa0409a98:"$source" > "$source"
          set +e
          cargo test -p frankenlibc-abi --test dlfcn_native_lifecycle_test \
            native_lifecycle_callbacks_can_reenter_loader -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/retained-collector-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'left: [10, 1, 20, -20, -1, -10]' "artifacts/native-loader/retained-collector-${FRANKENLIBC_MODE}.log"
          grep -F 'right: [10, 1, 20, -20, -10, -1]' "artifacts/native-loader/retained-collector-${FRANKENLIBC_MODE}.log"
      - name: Prove native TLS regression rejects the retained loader
        run: |
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          saved=$(mktemp)
          cp "$source" "$saved"
          trap 'cp "$saved" "$source"' EXIT
          git fetch --no-tags --depth=1 origin 5b0ee5fd125b0458bf32e91d6c05c4c94cacea9a
          git show 5b0ee5fd125b0458bf32e91d6c05c4c94cacea9a:"$source" > "$source"
          set +e
          cargo test -p frankenlibc-abi --test dlfcn_native_tls_test \
            native_tls_data_bss_alignment_and_dlsym_match_host -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/retained-tls-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'TLS fixture was rejected by native loader' "artifacts/native-loader/retained-tls-${FRANKENLIBC_MODE}.log"
      - name: Prove native IFUNC execution rejects the retained loader
        run: |
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          tls=crates/frankenlibc-abi/src/dlfcn_tls.rs
          saved=$(mktemp -d)
          cp "$source" "$saved/native"
          cp "$tls" "$saved/tls"
          trap 'cp "$saved/native" "$source"; cp "$saved/tls" "$tls"' EXIT
          git fetch --no-tags --depth=1 origin e0d814633691925f962e58e642e079df1bb93f23
          git show e0d814633691925f962e58e642e079df1bb93f23:"$source" > "$source"
          git show e0d814633691925f962e58e642e079df1bb93f23:"$tls" > "$tls"
          set +e
          cargo test -p frankenlibc-abi --test dlfcn_native_ifunc_test \
            native_ifunc_data_got_plt_and_lookup_match_host -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/retained-ifunc-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'IFUNC fixture must load natively' "artifacts/native-loader/retained-ifunc-${FRANKENLIBC_MODE}.log"
      - name: Prove preemption regression rejects definition-first binding
        run: |
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          ifunc=crates/frankenlibc-abi/src/dlfcn_ifunc.rs
          tls=crates/frankenlibc-abi/src/dlfcn_tls.rs
          saved=$(mktemp -d)
          cp "$source" "$saved/native"
          cp "$ifunc" "$saved/ifunc"
          cp "$tls" "$saved/tls"
          trap 'cp "$saved/native" "$source"; cp "$saved/ifunc" "$ifunc"; cp "$saved/tls" "$tls"' EXIT
          git fetch --no-tags --depth=1 origin d0ebbac95d459830fc4f367f477162f5f8a67ab7
          git show d0ebbac95d459830fc4f367f477162f5f8a67ab7:"$source" > "$source"
          git show d0ebbac95d459830fc4f367f477162f5f8a67ab7:"$ifunc" > "$ifunc"
          git show d0ebbac95d459830fc4f367f477162f5f8a67ab7:"$tls" > "$tls"
          set +e
          cargo test -p frankenlibc-abi --test dlfcn_native_binding_test \
            native_binding_preempts_own_data_and_function_definitions -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/retained-binding-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'default-visible definitions must be preempted' "artifacts/native-loader/retained-binding-${FRANKENLIBC_MODE}.log"
          grep -F 'left: 15' "artifacts/native-loader/retained-binding-${FRANKENLIBC_MODE}.log"
          grep -F 'right: 81' "artifacts/native-loader/retained-binding-${FRANKENLIBC_MODE}.log"
      - name: Prove TLSDESC execution rejects the retained loader
        run: |
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          tls=crates/frankenlibc-abi/src/dlfcn_tls.rs
          saved=$(mktemp -d)
          cp "$source" "$saved/native"
          cp "$tls" "$saved/tls"
          trap 'cp "$saved/native" "$source"; cp "$saved/tls" "$tls"' EXIT
          git fetch --no-tags --depth=1 origin d21f379b4e97ff30cbfd114d96b85a396e9fe74b
          git show d21f379b4e97ff30cbfd114d96b85a396e9fe74b:"$source" > "$source"
          git show d21f379b4e97ff30cbfd114d96b85a396e9fe74b:"$tls" > "$tls"
          set +e
          cargo test -p frankenlibc-abi --test dlfcn_native_tlsdesc_test \
            native_tlsdesc_data_bss_alignment_and_dlsym_match_host -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/retained-tlsdesc-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'TLSDESC fixture must load natively' "artifacts/native-loader/retained-tlsdesc-${FRANKENLIBC_MODE}.log"
          grep -E 'test result: FAILED.*1 failed' "artifacts/native-loader/retained-tlsdesc-${FRANKENLIBC_MODE}.log"
      - name: Prove C++ termination rejects the retained loader
        run: |
          source=crates/frankenlibc-abi/src/dlfcn_native.rs
          saved=$(mktemp)
          cp "$source" "$saved"
          trap 'cp "$saved" "$source"' EXIT
          git fetch --no-tags --depth=1 origin b30fec3a1b73db1f8c9127c944fc2c13dea80860
          git show b30fec3a1b73db1f8c9127c944fc2c13dea80860:"$source" > "$source"
          set +e
          cargo test -p frankenlibc-abi --test dlfcn_native_cxa_test \
            native_cxa_real_cpp_static_objects_execute_and_reload -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/retained-cxa-${FRANKENLIBC_MODE}.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'C++ fixture failed to load:' "artifacts/native-loader/retained-cxa-${FRANKENLIBC_MODE}.log"
          grep -E 'test result: FAILED.*1 failed' "artifacts/native-loader/retained-cxa-${FRANKENLIBC_MODE}.log"
      - name: Execute native loader suites without hiding later targets on failure
        if: always()
        run: |
          mkdir -p artifacts/native-loader
          cargo test -p frankenlibc-abi --no-fail-fast \
            --test dlfcn_abi_test --test dlfcn_native_dependencies_test \
            --test dlfcn_native_search_test --test dlfcn_native_lifecycle_test \
            --test dlfcn_native_tls_test --test dlfcn_native_thread_exit_test \
            --test dlfcn_native_ifunc_test --test dlfcn_native_binding_test \
            --test dlfcn_native_tlsdesc_test --test dlfcn_native_cxa_test \
            -- --test-threads=1 2>&1 | tee "artifacts/native-loader/${FRANKENLIBC_MODE}.log"
      - name: Isolate host version lookup regression
        if: always()
        run: |
          mkdir -p artifacts/native-loader
          cargo test -p frankenlibc-abi --test dlfcn_abi_test \
            dlvsym_host_handle_resolves_symbol -- --exact --nocapture \
            2>&1 | tee "artifacts/native-loader/host-version-${FRANKENLIBC_MODE}.log"
      - name: Preserve execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-loader-execution-${{ matrix.mode }}
          path: artifacts/native-loader/
          if-no-files-found: error
