      - name: Show bounded stdio failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("artifacts/stdio-layout")
          endings = (".err", ".stderr", ".stderr.log", ".out", ".stdout", ".stdout.log", ".json")
          paths = [
              path for path in root.rglob("*")
              if path.is_file() and path.name.endswith(endings) and path.stat().st_size
          ]
          def priority(path):
              if path.name.endswith((".err", ".stderr", ".stderr.log")):
                  return 0
              return 1 if path.suffix == ".json" else 2
          budget = 64 * 1024
          for path in sorted(paths, key=lambda path: (priority(path), str(path))):
              with path.open("rb") as stream:
                  stream.seek(max(0, path.stat().st_size - 4096))
                  tail = stream.read(4096).decode("utf-8", errors="replace")
              block = (f"\n--- {path} (tail) ---\n{tail}\n")[:budget]
              print(block, end="")
              budget -= len(block)
              if budget == 0:
                  print("\nDiagnostic output capped at 64 KiB.")
                  break
          if not paths:
              print("No captured C fixture outputs or JSON summaries are available.")
          PY
      - uses: actions/upload-artifact@v4
