name: Native stdio FILE layout

on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenlibc-abi/src/stdio_abi.rs'
      - 'crates/frankenlibc-abi/src/glibc_internal_abi.rs'
      - 'crates/frankenlibc-abi/src/fortify_abi.rs'
      - 'crates/frankenlibc-abi/src/wchar_abi.rs'
      - 'crates/frankenlibc-abi/src/locale_abi.rs'
      - 'crates/frankenlibc-abi/src/ctype_abi.rs'
      - 'crates/frankenlibc-abi/src/resolv_abi.rs'
      - 'crates/frankenlibc-abi/src/inet_abi.rs'
      - 'crates/frankenlibc-abi/src/owned_tls_cache.rs'
      - 'crates/frankenlibc-abi/src/isoc_abi.rs'
      - 'crates/frankenlibc-abi/tests/stdio_abi_test.rs'
      - 'crates/frankenlibc-abi/tests/wchar_abi_test.rs'
      - 'crates/frankenlibc-abi/tests/locale_abi_test.rs'
      - 'crates/frankenlibc-abi/tests/resolv_abi_test.rs'
      - 'crates/frankenlibc-abi/tests/io_internal_native_file_test.rs'
      - 'crates/frankenlibc-abi/tests/native_file_layout_test.rs'
      - 'crates/frankenlibc-abi/version_scripts/libc.map'
      - 'crates/frankenlibc-abi/tests/conformance_diff_stdio_printf.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_dprintf.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_getline.rs'
      - 'crates/frankenlibc-core/tests/stdio_read_window_regression_test.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_fscanf_host_stream.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_swprintf.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_swscanf.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_scanf_malloc.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_isoc_sscanf_alias.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_shadow_lines.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_fgetpos.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_wide_stdio_write.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_fopencookie.rs'
      - 'crates/frankenlibc-abi/tests/conformance_diff_stdio_eof.rs'
      - 'crates/frankenlibc-abi/tests/open_wmemstream_differential_test.rs'
      - 'crates/frankenlibc-abi/tests/glibc_internal_abi_test.rs'
      - 'crates/frankenlibc-abi/tests/stdio_locking_stress_test.rs'
      - 'crates/frankenlibc-abi/src/stdio_abi/**'
      - 'crates/frankenlibc-abi/src/io_internal_abi.rs'
      - 'crates/frankenlibc-abi/src/io_internal_abi/**'
      - 'crates/frankenlibc-abi/src/unistd_abi.rs'
      - 'crates/frankenlibc-abi/src/pthread_abi.rs'
      - 'crates/frankenlibc-core/src/stdio/**'
      - 'crates/frankenlibc-core/src/iconv/**'
      - 'crates/frankenlibc-core/src/pthread/**'
      - 'crates/frankenlibc-core/src/mntent/**'
      - 'tests/integration/fixture_stdio.c'
      - 'tests/integration/fixture_exit_sequence.c'
      - 'tests/integration/fixture_stdio_globals.c'
      - 'tests/integration/fixture_stdio_file_layout.c'
      - 'tests/integration/fixture_stdio_positions.c'
      - 'tests/integration/fixture_stdio_lifetime.c'
      - 'tests/integration/fixture_callback_unwind.cpp'
      - 'tests/integration/fixture_stdio_printf.c'
      - 'tests/integration/fixture_stdio_cancel.c'
      - 'tests/integration/fixture_mntent_file.c'
      - 'scripts/check_stdio_native.sh'
      - 'scripts/check_stdio_read_cancellation.sh'
      - 'scripts/check_mntent_file.py'
      - '.github/workflows/stdio-file-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  stdio-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cache: [default, owned]
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - name: Compare exact-width destinations and legacy allocation conversions
        env:
          CACHE: ${{ matrix.cache }}
        run: |
          features=()
          if [[ "$CACHE" == owned ]]; then
            features+=(--features owned-tls-cache)
          fi
          for mode in strict hardened; do
            export FRANKENLIBC_MODE="$mode"
            cargo test -p frankenlibc-abi "${features[@]}" \
              --test conformance_diff_isoc_sscanf_alias --test conformance_diff_swscanf bit_width \
              -- --test-threads=1
            cargo test -p frankenlibc-abi "${features[@]}" \
              --test conformance_diff_scanf_malloc legacy_ -- --test-threads=1
          done
      - name: Admit fwrite source bounds before cached or delegated writes
        env:
          CACHE: ${{ matrix.cache }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/stdio-regressions
          features=()
          if [[ "$CACHE" == owned ]]; then
            features+=(--features owned-tls-cache)
          fi
          for regression in hardened_fwrite_admits_tracked_source_before_dispatch \
              fwrite_rejects_unrepresentable_spans_before_reading \
              strict_hot_stdio_writes_skip_runtime_policy_gate; do
            log="artifacts/stdio-regressions/$regression.log"
            FRANKENLIBC_MODE=strict cargo test -p frankenlibc-abi "${features[@]}" \
              --test stdio_abi_test "$regression" \
              -- --exact --test-threads=1 --nocapture 2>&1 | tee "$log"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$log"
          done
      - name: Preserve complete shadow records and bounded float allocation
        env:
          CACHE: ${{ matrix.cache }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/stdio-regressions
          features=()
          if [[ "$CACHE" == owned ]]; then
            features+=(--features owned-tls-cache)
          fi
          cargo test -p frankenlibc-core "${features[@]}" --lib stdio::printf::tests \
            -- --test-threads=1 --nocapture 2>&1 | tee artifacts/stdio-regressions/printf-core.log
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' \
            artifacts/stdio-regressions/printf-core.log
          cargo test -p frankenlibc-core "${features[@]}" --lib stream_codec \
            -- --test-threads=1 --nocapture 2>&1 | tee artifacts/stdio-regressions/stream-codec.log
          grep -Eq '^test result: ok\. 2 passed; 0 failed; 0 ignored;' \
            artifacts/stdio-regressions/stream-codec.log
          cargo test -p frankenlibc-abi "${features[@]}" --test conformance_diff_shadow_lines \
            -- --test-threads=1 --nocapture 2>&1 | tee artifacts/stdio-regressions/shadow.log
          grep -Eq '^test result: ok\. 3 passed; 0 failed; 0 ignored;' \
            artifacts/stdio-regressions/shadow.log
          for regression in allocated_output_failure_stops_later_count_stores \
              huge_hex_float_precision_uses_one_output_allocation; do
            log="artifacts/stdio-regressions/$regression.log"
            # Each regression executes independent strict/hardened children.
            cargo test -p frankenlibc-abi "${features[@]}" --test conformance_diff_swscanf \
              "locale_scanning::$regression" -- --exact --test-threads=1 --nocapture \
              2>&1 | tee "$log"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$log"
          done
      - name: Preserve wide conversion, transliteration, and character pushback
        if: always()
        env:
          CACHE: ${{ matrix.cache }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/stdio-regressions
          features=()
          if [[ "$CACHE" == owned ]]; then
            features+=(--features owned-tls-cache)
          fi
          cargo test -p frankenlibc-core "${features[@]}" --lib wide_backup \
            -- --test-threads=1 --nocapture 2>&1 | tee artifacts/stdio-regressions/wide-backup-core.log
          grep -Eq '^test result: ok\. 4 passed; 0 failed; 0 ignored;' \
            artifacts/stdio-regressions/wide-backup-core.log
          cargo test -p frankenlibc-core "${features[@]}" --lib wide_output_ \
            -- --test-threads=1 --nocapture 2>&1 | tee artifacts/stdio-regressions/wide-output-core.log
          grep -Eq '^test result: ok\. 9 passed; 0 failed; 0 ignored;' \
            artifacts/stdio-regressions/wide-output-core.log
          for mode in strict hardened; do
            log="artifacts/stdio-regressions/wide-output-$mode.log"
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi "${features[@]}" \
              --test conformance_diff_wide_stdio_write -- --test-threads=1 --nocapture \
              2>&1 | tee "$log"
            grep -Eq '^test result: ok\. 12 passed; 0 failed; 0 ignored;' "$log"
          done
      - name: Recover from line-input allocation failure under real memory pressure
        if: always()
        env:
          CACHE: ${{ matrix.cache }}
          FRANKENLIBC_RUNTIME_MATH: 'off'
        run: |
          set -euo pipefail
          mkdir -p artifacts/stdio-regressions
          features=()
          if [[ "$CACHE" == owned ]]; then
            features+=(--features owned-tls-cache)
          fi
          cargo test -p frankenlibc-core "${features[@]}" \
            --test stdio_read_window_regression_test -- --test-threads=1 --nocapture \
            2>&1 | tee artifacts/stdio-regressions/read-window.log
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' \
            artifacts/stdio-regressions/read-window.log
          for mode in strict hardened; do
            log="artifacts/stdio-regressions/getline-$mode.log"
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi "${features[@]}" \
              --test conformance_diff_getline -- --test-threads=1 --nocapture \
              2>&1 | tee "$log"
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stdio-regressions-${{ matrix.cache }}
          path: artifacts/stdio-regressions/

  cookie-callbacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cache: [default, owned]
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
      - name: Exercise callback reentry, errors, buffering, and unwinding
        env:
          CACHE: ${{ matrix.cache }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/cookie-callbacks
          features=()
          if [[ "$CACHE" == owned ]]; then
            features+=(--features owned-tls-cache)
          fi
          for mode in strict hardened; do
            log="artifacts/cookie-callbacks/$mode.log"
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi "${features[@]}" \
              --test conformance_diff_fopencookie -- --test-threads=1 --nocapture \
              2>&1 | tee "$log"
            grep -Eq '^test result: ok\. 19 passed; 0 failed; 0 ignored;' "$log"
            log="artifacts/cookie-callbacks/input-sync-$mode.log"
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi "${features[@]}" \
              --test conformance_diff_stdio_eof input_ -- --test-threads=1 --nocapture \
              2>&1 | tee "$log"
            grep -Eq '^test result: ok\. 4 passed; 0 failed; 0 ignored;' "$log"
          done
      - name: Preserve byte conversion across native FILE backends
        if: always()
        env:
          CACHE: ${{ matrix.cache }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/cookie-callbacks
          features=()
          if [[ "$CACHE" == owned ]]; then
            features+=(--features owned-tls-cache)
          fi
          for mode in strict hardened; do
            log="artifacts/cookie-callbacks/character-$mode.log"
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi "${features[@]}" \
              --test conformance_diff_stdio_eof character_ \
              -- --test-threads=1 --nocapture 2>&1 | tee "$log"
            grep -Eq '^test result: ok\. 2 passed; 0 failed; 0 ignored;' "$log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookie-callbacks-${{ matrix.cache }}
          path: artifacts/cookie-callbacks/

  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Preserve exact source for ABI failure diagnosis
        run: |
          mkdir -p artifacts/stdio-layout
          git ls-files -z Cargo.toml Cargo.lock rust-toolchain.toml crates tests scripts include .cargo AGENTS.md PLAN_TO_PORT_GLIBC_TO_RUST.md .beads/issues.jsonl | tar --null -T - -czf artifacts/stdio-layout/source.tar.gz
          git rev-parse HEAD > artifacts/stdio-layout/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stdio-layout-source
          path: artifacts/stdio-layout/
          retention-days: 7
  stdio:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
      FRANKENLIBC_TEST_PRESERVE_FILES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      # BEGIN STDIO BOOTSTRAP
      - name: Preserve toolchain for isolated ABI debugging
        if: github.run_number == 1
        run: |
          cargo fetch --locked
          mkdir -p artifacts/stdio-toolchain
          tar -C "$HOME" -czf artifacts/stdio-toolchain/rust.tar.gz .rustup/toolchains/nightly-2026-08-31-x86_64-unknown-linux-gnu .cargo/registry
      - uses: actions/upload-artifact@v4
        if: github.run_number == 1
        with:
          name: stdio-layout-toolchain
          path: artifacts/stdio-toolchain/
          retention-days: 1
      # END STDIO BOOTSTRAP
      - name: Build deployed ABI and optimized C caller
        id: build
        run: |
          set -euo pipefail
          mkdir -p artifacts/stdio-layout
          cargo build --release -p frankenlibc-abi --lib 2>&1 | tee artifacts/stdio-layout/build.log
          cc -O2 -Wall -Wextra -Werror tests/integration/fixture_stdio_file_layout.c -o target/stdio-file-layout
      - name: Preserve process startup and normal host exit
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          library="$PWD/target/release/libfrankenlibc_abi.so"
          printf 'stdio-normal-exit\n' > artifacts/stdio-layout/echo-expected.out
          for mode in strict hardened; do
            prefix="artifacts/stdio-layout/startup-$mode"
            timeout --kill-after=2s 20 env FRANKENLIBC_MODE="$mode" LD_PRELOAD="$library" \
              /bin/true > "$prefix-true.out" 2> "$prefix-true.err"
            test ! -s "$prefix-true.out"
            test ! -s "$prefix-true.err"
            timeout --kill-after=2s 20 env FRANKENLIBC_MODE="$mode" LD_PRELOAD="$library" \
              /bin/echo stdio-normal-exit > "$prefix-echo.out" 2> "$prefix-echo.err"
            cmp artifacts/stdio-layout/echo-expected.out "$prefix-echo.out"
            test ! -s "$prefix-echo.err"
          done
      - name: Preserve freopen descriptors, close-on-exec and process-pipe ownership
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          status=0
          for feature in default owned; do
            feature_args=()
            if [[ "$feature" == owned ]]; then
              feature_args+=(--features owned-tls-cache)
            fi
            for mode in strict hardened; do
              log="artifacts/stdio-layout/freopen-$feature-$mode.log"
              if ! FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi \
                "${feature_args[@]}" --test stdio_abi_test freopen \
                -- --test-threads=1 --nocapture 2>&1 | tee "$log"; then
                status=1
              fi
              if ! grep -Eq '^test result: ok\. 7 passed; 0 failed; 0 ignored;' "$log"; then
                status=1
              fi
            done
          done
          exit "$status"
      - name: Prepare real numeric locales for scanf conformance
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          if ! command -v localedef >/dev/null || \
              [[ ! -f /usr/share/i18n/locales/ps_AF ]] || \
              [[ ! -f /usr/share/i18n/locales/de_DE ]]; then
            sudo apt-get update
            sudo apt-get install -y locales
          fi
          locale_path="$PWD/target/stdio-scanner-locales"
          mkdir -p "$locale_path"
          localedef --no-archive -i ps_AF -f UTF-8 "$locale_path/ps_AF.UTF-8"
          localedef --no-archive -i de_DE -f UTF-8 "$locale_path/de_DE.UTF-8"
          printf 'FRANKENLIBC_TEST_LOCALE_PATH=%s\n' "$locale_path" >> "$GITHUB_ENV"
      - name: Preserve original wide input across scanf destinations and dialects
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          test -n "${FRANKENLIBC_TEST_LOCALE_PATH:-}"
          localedef --no-archive -i fr_FR -f ISO-8859-1 "$FRANKENLIBC_TEST_LOCALE_PATH/fr_FR"
          status=0
          for feature in default owned; do
            feature_args=()
            if [[ "$feature" == owned ]]; then
              feature_args+=(--features owned-tls-cache)
            fi
            log="artifacts/stdio-layout/swscanf-locale-$feature.log"
            # The isolated locale tests execute strict and hardened subprocesses.
            if ! cargo test -p frankenlibc-abi "${feature_args[@]}" \
              --test conformance_diff_swscanf \
              -- --test-threads=1 --nocapture 2>&1 | tee "$log"; then
              status=1
            fi
            if ! grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then
              status=1
            fi
            for regression in \
              wide_buffer_preserves_raw_wchar_values \
              wide_buffer_encodes_original_extended_characters \
              wide_buffer_raw_positional_allocations; do
              if ! grep -Eq "^test locale_scanning::$regression \\.\\.\\. ok$" "$log"; then
                status=1
              fi
            done
          done
          exit "$status"
      - name: Preserve numeric radix widths and unread scanf input
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          test -n "${FRANKENLIBC_TEST_LOCALE_PATH:-}"
          core_log=artifacts/stdio-layout/scanf-numeric-radix-core.log
          cargo test -p frankenlibc-core --lib wide_stream_scan_tests \
            -- --test-threads=1 --nocapture 2>&1 | tee "$core_log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$core_log"
          for regression in \
            multibyte_radix_preserves_narrow_widths_and_source_counts \
            multibyte_radix_retains_partial_input_and_distinguishes_eof \
            multibyte_radix_wide_buffer_width_counts_characters; do
            grep -Eq "^test .*::$regression \\.\\.\\. ok$" "$core_log"
          done
          for mode in strict hardened; do
            log="artifacts/stdio-layout/fscanf-numeric-radix-$mode.log"
            FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi \
              --test conformance_diff_fscanf_host_stream \
              -- --test-threads=1 --nocapture 2>&1 | tee "$log"
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"
            grep -Eq '^test streaming_narrow::numeric_radix_preserves_byte_widths_counts_and_unread_input \.\.\.' "$log"
          done
      - name: Preserve real GNU standard stream objects and COPY relocations
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          FRANKENLIBC_TEST_LIBRARY="$PWD/target/release/libfrankenlibc_abi.so" \
          FRANKENLIBC_STDIO_OUT_DIR="$PWD/artifacts/stdio-layout/globals" \
            timeout 120 bash scripts/check_stdio_native.sh --globals-only
      - name: Isolate native thread stdio state and persistent buffers
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          for feature in default owned; do
            feature_args=()
            if [[ "$feature" == owned ]]; then
              feature_args+=(--features owned-tls-cache)
            fi
            for mode in strict hardened; do
              log="artifacts/stdio-layout/native-tls-$feature-$mode.log"
              FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi \
                "${feature_args[@]}" --test stdio_abi_test stdio_native_tls_ \
                -- --test-threads=1 --nocapture 2>&1 | tee "$log"
              grep -Eq '^test result: ok\. 3 passed; 0 failed; 0 ignored;' "$log"
            done
          done
      - name: Isolate native wide formatting and conversion state
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          for feature in default owned; do
            feature_args=()
            if [[ "$feature" == owned ]]; then
              feature_args+=(--features owned-tls-cache)
            fi
            for mode in strict hardened; do
              log="artifacts/stdio-layout/wide-native-tls-$feature-$mode.log"
              FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi \
                "${feature_args[@]}" --test wchar_abi_test wchar_native_tls_ \
                -- --test-threads=1 --nocapture 2>&1 | tee "$log"
              grep -Eq '^test result: ok\. 3 passed; 0 failed; 0 ignored;' "$log"
            done
          done
      - name: Isolate native locale selection and numeric formatting
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          for feature in default owned; do
            feature_args=()
            if [[ "$feature" == owned ]]; then
              feature_args+=(--features owned-tls-cache)
            fi
            for mode in strict hardened; do
              log="artifacts/stdio-layout/locale-native-tls-$feature-$mode.log"
              FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi \
                "${feature_args[@]}" --test locale_abi_test locale_native_tls_ \
                -- --test-threads=1 --nocapture 2>&1 | tee "$log"
              grep -Eq '^test result: ok\. 3 passed; 0 failed; 0 ignored;' "$log"
            done
          done
      - name: Isolate native resolver caches and returned buffers
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          for feature in default owned; do
            feature_args=()
            if [[ "$feature" == owned ]]; then
              feature_args+=(--features owned-tls-cache)
            fi
            for mode in strict hardened; do
              log="artifacts/stdio-layout/resolver-native-tls-$feature-$mode.log"
              FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi \
                "${feature_args[@]}" --test resolv_abi_test resolver_native_tls_ \
                -- --test-threads=1 --nocapture 2>&1 | tee "$log"
              grep -Eq '^test result: ok\. 3 passed; 0 failed; 0 ignored;' "$log"
            done
          done
      - name: Verify native FILE layout and standard stream registry behavior
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p artifacts/stdio-layout
          for mode in strict hardened; do
            for target in stdio_abi_test io_internal_native_file_test native_file_layout_test; do
              FRANKENLIBC_MODE="$mode" cargo test -p frankenlibc-abi \
                --test "$target" -- --test-threads=1 --nocapture \
                2>&1 | tee "artifacts/stdio-layout/$target-$mode.log"
              grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed;' \
                "artifacts/stdio-layout/$target-$mode.log"
            done
          done
      - name: Preserve saved positions and buffered output against live host stdio
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p artifacts/stdio-layout
